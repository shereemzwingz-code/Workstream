<br style="page-break-before:always"><h1>STATEMENT OF WORK</h1>
<p>This Statement of Work (this “SOW”) is made and entered into as of ${X(m.eff)} (“Effective Date”) by and between Dimension RE LLC, a Delaware limited liability company (“Company”) and ${X(m.cap)}, ${X(m.kind)} (“Customer Acquisition Partner” or “CAP”) the “Parties” pursuant to that certain Master Services Agreement, dated as of ${X(m.eff)}, by and between Company and CAP (as amended, supplemented or otherwise modified, the “MSA”). Capitalized terms used and not otherwise defined in this SOW shall have the meanings ascribed to them in the MSA.</p>
<p>In consideration of the rights and obligations of the parties hereunder, and other good and valuable consideration, the receipt and sufficiency of which is hereby acknowledged by the parties, the parties hereby agree as follows:</p>
${sec("1. Incorporation of MSA Terms and Conditions.",`<p>This SOW constitutes a Statement of Work as contemplated by Section 1.1 of the MSA. In the event of any inconsistency or discrepancy between the terms and conditions of the MSA and the terms and conditions of this SOW, the terms and conditions of this SOW shall prevail.</p>`)}
${sec("2. Definitions",`<p>a. Client: An individual that uses the services of an affiliate of the CAP<br>b. Subscriber: An individual which has subscribed to the Company’s community solar Project through the CAP<br>c. Portal: An online platform through which the CAP may help enroll clients in the projects and track enrollments on a digital dashboard<br>d. Enrollment Coordinator: An individual who will assist in enrolling Clients to the Projects</p>`)}
${sec("3. List of Projects.",`<p>This SOW applies to the Projects described in the Projects Table.</p><table><tr><th>Project SPV Name</th><th>kWdc</th><th>Utility Service Territory</th><th>Community Solar Program</th><th>Estimated Subscribers</th><th>Projected Availability</th></tr><tr><td>${X(m.project)}</td><td>${X(m.kw)}</td><td>${X(m.utility)}</td><td>${X(m.program)}</td><td>${X(m.subs)}</td><td>${X(m.avail)}</td></tr></table>`)}
${sec("4. Term.",`<p>This SOW will commence on the date first written above and will continue for a term of twelve (12) months or until earlier terminated by either Party. Notwithstanding the foregoing, either Party may terminate this SOW for any reason without liability to the other Party by providing 60 days’ prior written notice.</p>`)}
${sec("5. Duties and Obligations of the Parties",`<p>5.1 Company. Company is responsible for developing, constructing, commissioning, interconnecting, owning, operating, and maintaining the Project. In relation to its work supporting CAP’s acquisition of customers, Company shall:<br>a. Reserve community solar capacity on the Projects to serve CAP’s clients<br>b. Provide guaranteed monthly utility bill savings for enrolled Clients<br>c. Provide an educational and marketing materials package that can be used by CAP to make its members aware of the economic and environmental benefits associated with subscribing to the Projects. This package will include enrollment materials for CAP’s team, a community solar overview presentation, a community solar flyer, community solar FAQs, a co-branded enrollment landing page utilizing CAP’s logo, and social media post templates<br>d. Provide a fully functioning web-based portal for enrollment through which CAP’s clients may subscribe to its projects<br>e. Provide a regular report to CAP outlining the number of Clients CAP has fully enrolled in the Projects and have been validated by the utility as well as a list of Clients that have partially completed their enrollment along with an explanation of the remaining steps that need to be completed<br>f. Administer the delivery of gift cards and any other form of upfront incentive that Clients receive upon having their enrollment fully validated<br>g. Provide training and support for all activities to assist CAP to remain in compliance with the Illinois Shines program</p><p>5.2 CAP. The CAP is engaged in education, outreach and customer acquisition for the Projects and agrees to use good faith efforts to perform the following actions:<br>a. Adopt an outreach and enrollment plan in its sole discretion that CAP believes in good faith will generate community interest in the Projects, with a focus on reaching low-moderate income Clients<br>b. Assist in enrolling clients in the Projects, including collaborating with Company or its partners that are leading the customer enrollment process<br>c. Designate a dedicated point of contact at CAP for Dimension to communicate with about customer acquisition progress<br>d. Designate a regular cadence to hold check-in meetings with Dimension to report on customer acquisition progress, challenges, and feedback on the customer acquisition process<br>e. Adjust outreach and enrollment plan based on progress and feedback from Enrollment Coordinators<br>f. Provide documentation to Company, as may be requested from Company from time to time to support compliance with the Illinois Shines program, including Certificate of Good Standing with the Illinois Secretary of State<br>g. Participate in Illinois Shines training and any other such means or events that Company provides to assist CAP compliance with the Illinois Shines program</p>`)}
${sec("6. Service Fees and Payment Terms.",`<p>6.1 Payment Structure. The Company will provide success-based, enrollment milestone and ongoing payments to the CAP in the manner laid out below.</p><p>6.1.1 Upfront Payment: a. The Company will pay ${money(b.G)} upfront, after the successful completion of ${b.UA||10} enrollments, to support the implementation of a community solar enrollment and education campaign and support CAP’s core programming.</p><p>6.1.2 Success-Based Payments: a. ${money(b.F1)} for every Subscriber that enrolls in the Projects and has subsequently been validated by the Company’s subscription management partner for the first ${b.T1} low-and-moderate income (LMI) Subscribers enrolled in the Projects. b. ${money(b.F2)} for the ${b.T1+1}${[1,2,3].includes((b.T1+1)%10)&&![11,12,13].includes((b.T1+1)%100)?["st","nd","rd"][(b.T1+1)%10-1]:"th"} LMI Subscriber and every Subscriber enrolled in the Projects thereafter which has been validated by the Company’s subscription management partner. There is no cap on the number of Clients the CAP can enroll in the Projects, provided they qualify for the Illinois Shines program.</p><p>6.1.3 Enrollment Milestone Payments: Company will pay the CAP the following amounts as the following number of Subscribers has been enrolled and validated in the Projects: a. ${b.TB1} subscribers: ${money(b.B1)} b. ${b.TB2} subscribers: ${money(b.B2)}</p><p>6.2 Payment Terms. The Company will provide the CAP with a list of fully enrolled and validated customers at the end of every month. The CAP will invoice the Company based on the list provided by the Company. The Company will pay the CAP within thirty (30) days of receipt of any invoice.</p><p style="text-align:center">[Signature Page Follows]</p>`)}

   <section class="refsec"><h2>✨ Elena's SPAV + designee steps</h2><ol class="refsteps">${SOP.map(x=>`<li>${x}</li>`).join("")}</ol></section>

async function panelAct(act,p,card){
  const save=async(patch,msg,hist)=>{ try{ await pcol().doc(p.id).update({...patch,history:pHist(p,hist)}); toast(msg); }catch(err){ writeErr(err); } };
  if(act==="bcalc"){ const b=readBudget(card); await save({budget:b},"💰 Budget saved","Budget updated: total "+money(bCalc(b).total)); return true; }
  if(act==="bcopy"){ const ok=await copyText(budgetText(p,readBudget(card))); toast(ok?"📋 Budget copied":"Press and hold to copy"); return true; }
  if(act==="bxl"){ await budgetXlsx(p,readBudget(card)); return true; }
  if(act==="svsave"){ const v=readSav(card); await save({sav:{...(p.sav||{}),...v,savedAt:new Date().toISOString()}},"💾 Savings & project saved","Savings/project details updated"); return true; }
  if(act==="svslide"){ const v=readSav(card); const sav={...(p.sav||{}),...v,savedAt:new Date().toISOString()}; await save({sav},"💾 Saved — making the slide…","Savings/project details updated"); const pg=+((S.svPg)||14);
    await deckCanva({...p,sav},{...(p.deck||{})},{pages:[pg],title:pg===14?"Savings":"Project",sav:true}); const m=S.dkMsg; toast(m&&m.err?m.html.replace(/<[^>]+>/g,""):"📊 Slide ready in Canva"); renderList(); return true; }
  if(act==="bslide"){ const b=readBudget(card); await save({budget:{...b,savedAt:new Date().toISOString()}},"💾 Budget saved — making the slide…","Budget saved"); p.budget=b; await deckCanva({...p,budget:b},{...(p.deck||{})},{template:BUDGET_TPL,pages:[1],title:"Budget",budget:true}); const m=S.dkMsg; toast(m&&m.err?m.html.replace(/<[^>]+>/g,""):"📊 Budget slide ready in Canva"); renderList(); return true; }
  if(act==="msave"){ await save({msa:readMsa(card)},"💾 MSA details saved","MSA details updated"); return true; }
  if(act==="mfill"){
    if(!S.sample){ toast("Needs the Claude app or claude.ai"); return true; }
    const cur=readMsa(card); const b=card.querySelector('[data-pact="mfill"]'); b.disabled=true; b.textContent="✨ Filling…";
    try{ const name=String(cur.cap||p.org||p.name||"").trim(); b.textContent="🔎 Searching the web, email, OneDrive…"; const {r,src,warn}=await msaResearch(name,p);
      const merged={...cur}; const filled=[]; ["kind","mission","served","addr"].forEach(k=>{ if(!String(merged[k]||"").trim()&&r&&r[k]){ merged[k]=String(r[k]); filled.push(k); } });
      if(!src.length){ toast("Nothing found about "+name+(warn?" — "+warn:"")); b.disabled=false; b.textContent="🔎 Find & fill blanks"; return true; }
      await save({msa:merged},filled.length?"✅ Filled "+filled.join(", ")+" — check before sending"+(warn?" · "+warn:""):"Nothing new found — the blanks stay for you to fill"+(warn?" · "+warn:""),"MSA blanks filled from web/email/OneDrive: "+(filled.join(", ")||"none")); }
    catch(e){ toast(e?.code==="not_granted"?"Allow Claude for this page, then try again":"Couldn't fill right now"); b.disabled=false; b.textContent="🔎 Find & fill blanks"; }
    return true; }
  if(act==="mdoc"){ const m=readMsa(card); try{ await pcol().doc(p.id).update({msa:m}); }catch{}

const KMOODS={walk:"on patrol",lick:"grooming",stretch:"stretching",sip:"sipping",preen:"unbothered",strut:"strutting",fan:"fanning herself",shades:"unbothered",clap:"applauding you",rest:"resting",point:"pointing",shine:"a word for you"};
const KITTY={timer:null,hide:null,last:-1,walk:null,idle:null,x:14,dir:1};
const KIDLE=[["lick",3800],["stretch",3600],["preen",3200],["sip",3400],["fan",2600],["point",2200]];
function kWidth(){ try{ return Math.max(240,innerWidth-150); }catch(_){ return 600; } }
function kSetX(x,dur){ const k=$("kitty"); if(!k) return; KITTY.x=x; k.style.setProperty("--kdur",(dur||7)+"s"); k.style.setProperty("--kx",Math.round(x)+"px"); }
function kFace(dir){ const k=$("kitty"); if(!k) return; KITTY.dir=dir; k.classList.toggle("facing-left",dir<0); }
function kStopMoving(){ clearTimeout(KITTY.walk); clearTimeout(KITTY.idle); const k=$("kitty"); if(k) k.classList.remove("walking"); }
// She crosses the screen at her own pace, pausing to groom, stretch or simply be admired.
function kPatrol(){ const k=$("kitty"); if(!k||k.hidden||!k.classList.contains("show")) return;
  clearTimeout(KITTY.walk); clearTimeout(KITTY.idle);
  const span=kWidth(), here=KITTY.x;
  let to=Math.round(14+Math.random()*span); if(Math.abs(to-here)<span*0.3) to=here<span/2?Math.round(span*0.72+Math.random()*span*0.25):Math.round(14+Math.random()*span*0.28);
  const dist=Math.abs(to-here), dur=Math.max(3.2,Math.min(11,dist/78));   // an unhurried ~78px a second
  kFace(to>here?1:-1); kMood("walk"); k.classList.add("walking"); kSetX(to,dur);
  KITTY.walk=setTimeout(()=>{ k.classList.remove("walking");
    const [m,ms]=KIDLE[Math.floor(Math.random()*KIDLE.length)]; kMood(m);        // arrives, then does a thing
    KITTY.idle=setTimeout(kPatrol,ms+Math.random()*1800);
  },dur*1000+60); }
function kGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function kSet(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(_){} }
function kSnoozed(){ return kGet("ws.kittyOff")===ymd(new Date()); }
// Scripture is most of what she says now; the rest is her own commentary.
function kPick(){ const scr=KITTY_SAYS.filter(x=>x[1]), own=KITTY_SAYS.filter(x=>!x[1]);
  let src=(Math.random()<0.6?scr:own); if(!src.length) src=KITTY_SAYS;
  let pick=src[0]; for(let n=0;n<8;n++){ pick=src[Math.floor(Math.random()*src.length)]; if(pick!==KITTY.last||src.length<2) break; }
  KITTY.last=pick; return pick; }
function kMood(m){ const k=$("kitty"); if(!k) return; Object.keys(KMOODS).forEach(x=>k.classList.remove("m-"+x)); if(m) k.classList.add("m-"+m); }
function kSayMood(m){ const k=$("kitty"); if(k&&k.classList.contains("walking")) return; kMood(m); }
// her lines are written here, so the italics in them are ours to trust; everything interpolated is escaped
function kSay(pick){ const [t,r,m]=pick||kPick(); kSayMood(m);
  $("ktxt").innerHTML=`<span class="kmood">👑 ${esc(KMOODS[m]||"holding court")}</span><br>`+(r?`<q>${t}</q><span class="kref">— ${esc(r)}</span>`:`${t}<span class="kref">— Duchess 🐾</span>`); }
// she reacts to what actually happens in the Workstream
const KITTY_REACT={
  done:[["That is <i>handled</i>. Look at you.","","clap"],["One down, beautifully. Next.","","clap"],["Crossed off with style. I love that for us.","","strut"]],
  badge:[["A badge worthy of the wearer. Gorgeous.","","shine"],["Credentials, darling. That is how we do it.","","strut"]],
  deck:[["That deck is <i>dressed</i>. Go close somebody.","","shades"],["Built, branded and ready. Strut in there.","","strut"]],
  signed:[["SIGNED. Oh, we are celebrating this one.","","clap"],["Another partner in the fold. Magnificent.","","shine"]],
  email:[["Sent with grace. Now let it breathe.","","sip"],["Beautifully worded. Close the laptop for a minute.","","fan"]]
};
function kCheer(kind){ const set=KITTY_REACT[kind]; if(!set||kSnoozed()) return; const pick=set[Math.floor(Math.random()*set.length)];
  const k=$("kitty"); if(!k) return; kStopMoving(); k.classList.remove("walking"); k.hidden=false; kSetX(KITTY.x,0); kSay(pick);
  requestAnimationFrame(()=>requestAnimationFrame(()=>k.classList.add("show")));
  clearTimeout(KITTY.hide); KITTY.hide=setTimeout(kHide,11000); KITTY.idle=setTimeout(kPatrol,7000); }
function kShow(force){ const k=$("kitty"); if(!k) return; if(!force&&(kSnoozed()||document.hidden)) { kSchedule(); return; }
  const h=new Date().getHours(); const want=h<9?"sip":h>=21?"rest":null;   // morning tea, late-night wind-down
  const pick=want&&Math.random()<.6?(KITTY_SAYS.filter(x=>x[2]===want)[Math.floor(Math.random()*KITTY_SAYS.filter(x=>x[2]===want).length)]):null;
  kSay(pick); k.hidden=false; kSetX(KITTY.x,0); requestAnimationFrame(()=>requestAnimationFrame(()=>k.classList.add("show")));
  clearTimeout(KITTY.hide); KITTY.hide=setTimeout(kHide,26000); KITTY.idle=setTimeout(kPatrol,6500); }
function kHide(){ const k=$("kitty"); if(!k) return; kStopMoving(); k.classList.remove("show"); clearTimeout(KITTY.hide); setTimeout(()=>{ if(!k.classList.contains("show")) k.hidden=true; },600); kSchedule(); }
function kSchedule(){ clearTimeout(KITTY.timer); KITTY.timer=setTimeout(()=>kShow(false),(12+Math.random()*10)*60000); }
(function kInit(){ if(!$("kitty")) return;
  $("kcat").addEventListener("click",()=>{ const k=$("kitty"); kStopMoving(); if(k) k.classList.remove("walking"); kSay(); clearTimeout(KITTY.hide); KITTY.hide=setTimeout(kHide,26000); KITTY.idle=setTimeout(kPatrol,7000); });
  $("kmore").addEventListener("click",()=>{ kSay(); clearTimeout(KITTY.hide); KITTY.hide=setTimeout(kHide,18000); });
  $("kx").addEventListener("click",kHide);
  $("ksnooze").addEventListener("click",()=>{ kSet("ws.kittyOff",ymd(new Date())); kHide(); toast("Kitty will nap until tomorrow 😴 — Tools › Kitty brings her back"); });
  clearTimeout(KITTY.timer); KITTY.timer=setTimeout(()=>kShow(false),45000);
})();
</script>
