<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workstream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF5FB; --surface:#FFFFFF; --ink:#1E1430; --muted:#6B5D7E; --line:#E7DAEC;
  --head:#3B1366; --accent:#E8479B; --accent-ink:#FFFFFF; --head2:#5A1E8C;
  --late:#B42318; --late-bg:#FDE8E6;
  --s-ns:#E7EBF0; --s-ns-t:#3F4B5C;
  --s-ip:#ECDDFB; --s-ip-t:#5B21B6;
  --s-w:#FFF0B8;  --s-w-t:#6B5300;
  --s-c:#DDF2E3;  --s-c-t:#1E6B3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170D22; --surface:#22152F; --ink:#F3EAF7; --muted:#B4A3C4; --line:#3A2850; --head:#2A0B4A; --accent:#FF6FB5; --accent-ink:#2A0B1C;
  --late:#FF8C7E; --late-bg:#3A1D1C;
  --s-ns:#263247; --s-ns-t:#C3CCD9; --s-ip:#3A2160; --s-ip-t:#D4B8FA; --s-w:#40360F; --s-w-t:#F7DC7A; --s-c:#173623; --s-c-t:#8EDBA9;
}}
:root[data-theme="dark"]{
  --bg:#170D22; --surface:#22152F; --ink:#F3EAF7; --muted:#B4A3C4; --line:#3A2850; --head:#2A0B4A; --accent:#FF6FB5; --accent-ink:#2A0B1C;
  --late:#FF8C7E; --late-bg:#3A1D1C;
  --s-ns:#263247; --s-ns-t:#C3CCD9; --s-ip:#3A2160; --s-ip-t:#D4B8FA; --s-w:#40360F; --s-w-t:#F7DC7A; --s-c:#173623; --s-c-t:#8EDBA9;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px}

header{background:linear-gradient(135deg,var(--head) 0%,var(--head) 55%,#7A1E6C 100%);color:#fff;padding:18px 0 20px}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
h1{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1;margin:0;letter-spacing:-.02em}
.date{color:#E8C9F2;margin:4px 0 0}
.hbtn{background:transparent;color:#fff;border:1px solid #B07ACF;border-radius:8px;padding:6px 12px;cursor:var(--cur-pointer)}
.hbtn:hover{border-color:var(--accent)}

/* update box */
.upd{margin-top:16px;background:#fff;color:#1E1430;border-top:4px solid var(--accent);border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.upd label{display:block;font-weight:700;margin-bottom:6px}
.upd textarea{width:100%;min-height:70px;border:2px solid #E2CDEB;border-radius:10px;padding:10px 12px;resize:vertical;background:#FDF8FD;color:#1E1430}
.upd textarea:focus{border-color:var(--accent);outline:none}
.updbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 20px;font-weight:700;cursor:var(--cur-pointer)}
.go:disabled{opacity:.6;cursor:default}
.mic{background:#fff;color:#3B1366;border:2px solid var(--accent);border-radius:10px;padding:8px 14px;font-weight:700;cursor:var(--cur-pointer)}
.mic.rec{background:var(--accent);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,71,155,.5)}50%{box-shadow:0 0 0 8px rgba(232,71,155,0)}}
.micnote{font-size:14px;color:#7A1449;background:#FFE3F1;border-radius:8px;padding:8px 10px;margin-top:8px}
.hint{color:#6B5D7E;font-size:14px}
.stop{background:none;border:1px solid #C9D3E0;border-radius:10px;padding:9px 14px;cursor:var(--cur-pointer);color:#16202E}

.result{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px}
.result h3{margin:0 0 6px;font-size:16px}
.result ul{margin:0;padding-left:18px}
.result li{margin:3px 0}
.result .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:var(--cur-pointer)}

/* filters */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.count{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:var(--cur-pointer);font-size:14px}
.count b{font-size:15px}
.count.late b{color:var(--late)}
.count[aria-pressed="true"]{background:var(--head);color:#fff;border-color:var(--head)}
.count[aria-pressed="true"].late b{color:#FFB3A8}
.bar select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:14px}
.spacer{flex:1}

/* sections */
.sec{margin-top:18px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sechead{display:flex;align-items:center;gap:10px;padding:10px 14px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:16px;color:#16202E;cursor:var(--cur-pointer);width:100%;border:0;text-align:left}
.cicon{font-size:18px}
.sechead .n{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:400;font-size:14px;opacity:.8}
.sechead .goal{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:400;font-size:13px;opacity:.85;margin-left:auto;text-align:right}
.caret{transition:transform .15s}
.sec.closed .caret{transform:rotate(-90deg)}
.sec.closed .rows{display:none}

.thead,.task{display:grid;grid-template-columns:34px minmax(200px,2.1fr) 108px minmax(110px,1fr) 96px minmax(170px,1.6fr) minmax(140px,1.2fr) minmax(170px,1.5fr) 84px;gap:10px;align-items:start;padding:9px 12px}
.thead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line)}
.task{border-bottom:1px solid var(--line);background:var(--tint)}
.task:last-child{border-bottom:0}
.task.late{box-shadow:inset 4px 0 0 var(--late)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #D9C6E4;background:#FFFFFF;color:#8A6FA0;cursor:var(--cur-pointer);display:grid;place-items:center;padding:0;margin-top:1px;font-size:14px;font-weight:700;line-height:1}
.chk:hover,.chk:focus-visible{color:var(--late);border-color:var(--late)}
.chk.armed{width:auto;border-radius:8px;padding:0 8px;background:var(--late);border-color:var(--late);color:#fff;font-size:12px;white-space:nowrap}
.del.armed{background:var(--late);color:#fff;border-radius:8px;padding:4px 10px}
.acts{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.donebtn{border:1px solid var(--accent);background:#FFE3F1;color:#7A1449;border-radius:8px;padding:3px 8px;cursor:var(--cur-pointer);font-size:13px;white-space:nowrap}
.task.done .donebtn{background:var(--s-c);color:var(--s-c-t);border-color:var(--s-c-t);font-weight:700}
.tname{font-weight:700;display:inline}
.star{background:none;border:0;padding:0 6px 0 0;cursor:var(--cur-pointer);font-size:19px;line-height:1;color:#B9A6C9;vertical-align:-2px}
.star.on{color:var(--accent)}
.task.prio{box-shadow:inset 4px 0 0 var(--accent)}
.task.prio.late{box-shadow:inset 4px 0 0 var(--late)}
.feed{margin-top:14px}
.pgroup h2{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:18px;margin:22px 0 8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc,var(--line));border-radius:12px;margin-bottom:8px;overflow:hidden}
.pcard.prio{--pc:var(--accent)}
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) auto minmax(0,1.6fr) auto;gap:6px 14px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:11px 14px;cursor:var(--cur-pointer)}
.pname{font-weight:700}
.porg{font-size:13px;color:var(--muted)}
.pnext{font-weight:700;font-size:14px}
.pwhen{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pwhen.stale{color:var(--late);font-weight:700}
.pdetail{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.plabel{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.pdetail a{color:var(--head2,#5A1E8C);font-weight:700}
.mail{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px;max-height:240px;overflow:auto}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:var(--cur-pointer);font-size:14px;text-decoration:none;color:inherit}
.pbtn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pbtn.danger{color:var(--late);border-color:transparent}
.pbtn.armed{background:var(--late);color:#fff}
.pform{display:grid;gap:10px}
.pform .efields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pform label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.pform input,.pform select,.pform textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.pform textarea{min-height:70px;resize:vertical}
.addcard{background:var(--surface);border:2px dashed var(--accent);border-radius:12px;padding:12px 14px;margin-top:14px}
.st-nf{background:var(--late-bg);color:var(--late)}
@media (max-width:899px){ .prow{grid-template-columns:1fr auto} .pnext{grid-column:1/3} .pwhen{grid-column:1/3;text-align:left} }
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-size:14px;cursor:var(--cur-pointer)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.calhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--head);color:#fff}
.calhead h2{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:20px;margin:0;flex:1}
.calhead button{background:transparent;color:#fff;border:1px solid #B07ACF;border-radius:8px;padding:4px 10px;cursor:var(--cur-pointer)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:104px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;padding:4px;cursor:var(--cur-pointer);display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--bg);color:var(--muted)}
.day .num{font-size:13px;font-weight:700;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .num{background:var(--accent);color:var(--accent-ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--head)}
.ev{display:block;font-size:12px;line-height:1.25;padding:2px 5px;border-radius:5px;background:var(--ct);border-left:4px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.late{color:var(--late);font-weight:700}
.ev.done{text-decoration:line-through;opacity:.6}
.more{font-size:12px;color:var(--muted);padding-left:4px}
.dots{display:none}
.agenda{padding:12px 14px}
.agenda h3{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:17px;margin:0 0 6px}
.agenda ul{margin:0;padding:0}
.calnote{font-size:13px;color:var(--muted);padding:0 14px 12px}
@media (max-width:899px){
  .day{min-height:58px;align-items:center;padding:4px 2px}
  .day .ev,.day .more{display:none}
  .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block}
  .dots i.late{box-shadow:0 0 0 2px var(--late)}
}
.handle{display:inline-block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 8px 2px 0;vertical-align:-2px}
.task.dragging{opacity:.85;outline:2px dashed var(--accent);outline-offset:-2px;position:relative;z-index:2}
body.is-dragging{user-select:none;-webkit-user-select:none}
@keyframes flash{0%,60%{box-shadow:inset 0 0 0 3px var(--accent),0 0 0 4px rgba(232,71,155,.25)}100%{box-shadow:none}}
.task.flash{animation:flash 2.4s ease-out}
.citem{list-style:none;margin:6px 0;padding:8px 10px;border-left:5px solid var(--c);background:var(--ct);border-radius:8px;cursor:var(--cur-pointer)}
.citem:hover,.chg:hover{filter:brightness(.97)}
.citem .w,.chg .go2{font-size:12px;color:var(--muted)}
.result ul{padding-left:0}
.feed h3{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:17px;margin:20px 0 8px}
.chg{cursor:var(--cur-pointer);background:var(--ct,var(--surface));border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.chg .t{font-weight:700}
.chg .w{font-size:13px;color:var(--muted)}
.notes{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-line}
.notes summary{cursor:var(--cur-pointer);width:max-content}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.st-ns{background:var(--s-ns);color:var(--s-ns-t)}
.st-ip{background:var(--s-ip);color:var(--s-ip-t)}
.st-w{background:var(--s-w);color:var(--s-w-t)}
.st-c{background:var(--s-c);color:var(--s-c-t)}
.due.lateTxt{color:var(--late);font-weight:700}
.next{font-weight:700}
.lu-date{display:block;font-size:12px;color:var(--muted)}
.lbl{display:none}
.editbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:var(--cur-pointer);font-size:13px;background:var(--surface)}
.muted{color:var(--muted)}

/* edit panel */
.edit{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.efields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.edit label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.edit input,.edit select,.edit textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.edit textarea{min-height:56px;resize:vertical}
.hist{border-left:3px solid var(--accent);padding-left:10px;display:grid;gap:6px;font-size:14px}
.hist .when{font-size:12px;color:var(--muted)}
.erow{display:flex;gap:8px;flex-wrap:wrap}
.save{background:var(--head);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:var(--cur-pointer);font-weight:700}
.del{background:none;border:0;color:var(--late);cursor:var(--cur-pointer)}

.addrow{margin:10px 12px 12px}
.empty{padding:14px;color:var(--muted)}
.banner{background:var(--late-bg);color:var(--late);border-radius:10px;padding:12px 14px;margin-top:14px}
.toast{background:var(--head)!important;color:#fff!important;z-index:70!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1}

/* CP check-in view */
.cpwrap{margin-top:14px;display:grid;gap:14px}
.cpbar{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.cpbar h2{margin:0;font-size:19px}
.cpbar .sub{font-size:14px;color:var(--muted)}
.cpbar .grow{flex:1;min-width:200px}
.cpprep{background:var(--s-w);color:var(--s-w-t);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.cpsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cpsec>h3{margin:0;padding:10px 14px;font-size:15px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--bg)}
.cpsec>h3 .n{font-weight:400;color:var(--muted);font-size:13px}
.cpsec>h3 .hint2{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.cpitem{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px;border-left:5px solid var(--c)}
.cpitem:last-child{border-bottom:0}
.cptop{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cpnum{font-weight:800;color:var(--accent);min-width:18px}
.cpt{font-weight:700;cursor:var(--cur-pointer)}
.cpt:hover{text-decoration:underline}
.chip{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.late{color:var(--late);border-color:var(--late);font-weight:700}
.cpaskline{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.cpaskline label{font-size:12px;font-weight:700;color:var(--muted)}
.cpaskline input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.cpaskline input:focus{border-color:var(--accent);outline:none}
.cpaskline input.need{border-color:var(--s-w-t);background:var(--s-w)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;cursor:var(--cur-pointer)}
.types button[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:#fff;font-weight:700}
.cpctx{font-size:13px;color:var(--muted)}
.cpdone{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cpdone input{flex:1;min-width:180px;border:1.5px dashed var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.cpdone input:focus{border-style:solid;border-color:var(--accent);outline:none}
.cpempty{padding:14px;color:var(--muted);font-size:14px}
.cpwait{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.cpwait:last-child{border-bottom:0}
.mrec{border-bottom:1px solid var(--line)}
.mrec:last-child{border-bottom:0}
.mrec summary{padding:10px 14px;cursor:var(--cur-pointer);font-weight:700}
.mrec summary .sub{font-weight:400;color:var(--muted);font-size:13px}
.mbody{padding:0 14px 12px;display:grid;gap:10px}
.mbody h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.mbody ul{margin:0;padding-left:18px}
.mbody li{margin:2px 0}
.mgap{font-size:13px;background:var(--s-w);color:var(--s-w-t);border-radius:8px;padding:8px 10px}

/* collapsible meeting cards */
.mtog{all:unset;cursor:var(--cur-pointer);display:flex;gap:8px;align-items:center;flex:1;min-width:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.mtog:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mcar{transition:transform .15s;display:inline-block}
.mclosed .mcar{transform:rotate(-90deg)}
.mclosed h2{margin:0}
.mpeek{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Right now pop-up checklist */
.rnfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:800;font-size:15px;cursor:var(--cur-pointer);box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.rnfab b{background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;font-size:13px}
.rnpanel{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;width:min(380px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.28)}
.kitty{position:fixed;left:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:flex-end;gap:6px;pointer-events:none;transform:translate(var(--kx,14px),140%);transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.kitty.show{transform:translate(var(--kx,14px),0)}
/* the stroll: a long, unhurried transform between stops */
.kitty.walking{transition:transform var(--kdur,7s) cubic-bezier(.42,0,.58,1)}
.kitty.facing-left .kcat{transform:scaleX(-1)}
.kitty.walking .kbub{opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.kitty>*{pointer-events:auto}
.kcat{all:unset;pointer-events:auto;cursor:var(--cur-pointer);width:92px;height:96px;flex:none;-webkit-tap-highlight-color:transparent}
.kcat svg{width:100%;height:100%;overflow:visible}
.kitty.show .kbody{animation:kbob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.kitty .ktail{transform-origin:78px 86px;animation:kwag 1.4s ease-in-out infinite}
.kitty .keyes{animation:kblink 4.5s infinite;transform-origin:50% 48px}
.kitty .kear{transform-origin:50% 100%;transform-box:fill-box;animation:kear 6s infinite}
.kitty .kheart{animation:kbeat 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes kbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
@keyframes kwag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes kblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes kear{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-12deg)}94%{transform:rotate(4deg)}}
@keyframes kbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
/* the walk cycle — a slow, deliberate runway prowl */
.kitty.m-walk .kbody{animation:kprowl 1.05s ease-in-out infinite;transform-origin:50% 100%}
.kitty.m-walk .kpawL{transform-origin:38px 100px;animation:kstepL 1.05s ease-in-out infinite}
.kitty.m-walk .kpawR{transform-origin:62px 100px;animation:kstepR 1.05s ease-in-out infinite}
.kitty.m-walk .ktail{animation:ksway 2.1s ease-in-out infinite}
@keyframes kprowl{0%,100%{transform:translateY(0) rotate(-1.5deg)}25%{transform:translateY(-3px) rotate(0deg)}50%{transform:translateY(0) rotate(1.5deg)}75%{transform:translateY(-3px) rotate(0deg)}}
@keyframes kstepL{0%,100%{transform:translate(-5px,0) rotate(-6deg)}50%{transform:translate(6px,-7px) rotate(7deg)}}
@keyframes kstepR{0%,100%{transform:translate(6px,-7px) rotate(7deg)}50%{transform:translate(-5px,0) rotate(-6deg)}}
@keyframes ksway{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(18deg)}}
/* licking a paw — raise, lean in, tongue, repeat */
.kitty.m-lick .kpawR{transform-origin:62px 100px;animation:klickpaw 2.6s ease-in-out infinite}
.kitty.m-lick .kbody{animation:klicklean 2.6s ease-in-out infinite;transform-origin:50% 100%}
.kitty.m-lick .ktongue{display:block;animation:ktongue 2.6s ease-in-out infinite}
.kitty.m-lick .keyes{animation:none;transform:scaleY(.45);transform-origin:50% 44px}
@keyframes klickpaw{0%,12%,100%{transform:translate(0,0) rotate(0)}30%,70%{transform:translate(-14px,-44px) rotate(-26deg)}85%{transform:translate(-6px,-20px) rotate(-12deg)}}
@keyframes klicklean{0%,12%,100%{transform:rotate(0) translateY(0)}35%{transform:rotate(-5deg) translateY(2px)}55%{transform:rotate(-7deg) translateY(3px)}80%{transform:rotate(-2deg) translateY(1px)}}
@keyframes ktongue{0%,30%,100%{opacity:0;transform:translateY(0) scaleY(.4)}40%{opacity:1;transform:translateY(2px) scaleY(1)}50%{opacity:1;transform:translateY(4px) scaleY(1.15)}62%{opacity:1;transform:translateY(2px) scaleY(.9)}70%{opacity:0;transform:translateY(0) scaleY(.4)}}
/* the long luxurious stretch */
.kitty.m-stretch .kbody{animation:kstretch 3.4s cubic-bezier(.45,.05,.3,1) infinite;transform-origin:30% 100%}
.kitty.m-stretch .kpawL{transform-origin:38px 100px;animation:kstretchpaw 3.4s cubic-bezier(.45,.05,.3,1) infinite}
.kitty.m-stretch .ktail{animation:kstretchtail 3.4s ease-in-out infinite}
.kitty.m-stretch .keyes{animation:none;transform:scaleY(.25);transform-origin:50% 44px}
@keyframes kstretch{0%,100%{transform:scale(1,1) skewX(0) translateY(0)}35%{transform:scale(1.2,.82) skewX(-9deg) translateY(6px)}55%{transform:scale(1.26,.76) skewX(-12deg) translateY(8px)}75%{transform:scale(1.04,.97) skewX(-2deg) translateY(1px)}}
@keyframes kstretchpaw{0%,100%{transform:translate(0,0) rotate(0)}35%,55%{transform:translate(-26px,4px) rotate(-14deg)}}
@keyframes kstretchtail{0%,100%{transform:rotate(0)}45%{transform:rotate(-26deg)}}
/* Duchess — props and moods */
.kcat{width:104px;height:116px}
.kitty .kprop{display:none}
.kitty .kcrown{transform-origin:50px 8px}
.kitty.show .kcrown{animation:kcrown 5s ease-in-out infinite}
.kitty .kpearls{transform-origin:50px 70px}
.kitty.show .kpearls{animation:kpearl 3.6s ease-in-out infinite}
@keyframes kcrown{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-5deg) translateY(-1px)}96%{transform:rotate(3deg)}}
@keyframes kpearl{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2px)}}
/* sip */
.kitty.m-sip .kcup{display:block}
.kitty.m-sip .kcup{transform-origin:76px 92px;animation:ksip 3.2s ease-in-out infinite}
.kitty.m-sip .ksteam{animation:ksteam 2.2s ease-in-out infinite}
.kitty.m-sip .kpawR{transform-origin:62px 100px;animation:kpawup 3.2s ease-in-out infinite}
@keyframes ksip{0%,100%{transform:translate(0,0) rotate(0)}35%{transform:translate(-14px,-30px) rotate(-16deg)}55%{transform:translate(-14px,-32px) rotate(-30deg)}75%{transform:translate(-14px,-30px) rotate(-16deg)}}
@keyframes ksteam{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-3px)}}
@keyframes kpawup{0%,100%{transform:translate(0,0)}35%,75%{transform:translate(-9px,-16px)}}
/* preen — files her nails */
.kitty.m-preen .kpawR{transform-origin:62px 100px;animation:kpreen 1.1s ease-in-out infinite}
.kitty.m-preen .knails{animation:knail 1.1s ease-in-out infinite}
.kitty.m-preen .kstars{display:block}
@keyframes kpreen{0%,100%{transform:translate(-6px,-14px) rotate(-12deg)}50%{transform:translate(-13px,-17px) rotate(-20deg)}}
@keyframes knail{0%,100%{stroke:#E2457F}50%{stroke:#FFD166}}
/* strut */
.kitty.m-strut .kbody{animation:kstrut 1.5s ease-in-out infinite}
.kitty.m-strut .ktail{animation:kflick .9s ease-in-out infinite}
@keyframes kstrut{0%,100%{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(5px) rotate(2.5deg)}}
@keyframes kflick{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(22deg)}}
/* fan herself */
.kitty.m-fan .kfan{display:block}
.kitty.m-fan .kfanb{transform-origin:18px 92px;animation:kfanw .62s ease-in-out infinite}
.kitty.m-fan .kpawL{transform-origin:38px 100px;animation:kfanp .62s ease-in-out infinite}
@keyframes kfanw{0%,100%{transform:translate(-2px,-20px) rotate(-22deg)}50%{transform:translate(4px,-20px) rotate(16deg)}}
@keyframes kfanp{0%,100%{transform:translate(-1px,-13px)}50%{transform:translate(3px,-13px)}}
/* unbothered — shades drop on */
.kitty.m-shades .kshades{display:block;animation:kdrop .5s cubic-bezier(.34,1.56,.64,1)}
.kitty.m-shades .keyes{opacity:0}
.kitty.m-shades .kmouth{d:path("M44 57 Q50 54 56 57")}
@keyframes kdrop{from{transform:translateY(-26px);opacity:0}to{transform:translateY(0);opacity:1}}
/* applaud */
.kitty.m-clap .kstars{display:block}
.kitty.m-clap .kpawL{transform-origin:38px 100px;animation:kclapL .42s ease-in-out infinite}
.kitty.m-clap .kpawR{transform-origin:62px 100px;animation:kclapR .42s ease-in-out infinite}
@keyframes kclapL{0%,100%{transform:translate(0,-14px) rotate(-12deg)}50%{transform:translate(9px,-14px) rotate(6deg)}}
@keyframes kclapR{0%,100%{transform:translate(0,-14px) rotate(12deg)}50%{transform:translate(-9px,-14px) rotate(-6deg)}}
/* rest */
.kitty.m-rest .kzzz{display:block}
.kitty.m-rest .keyes{animation:none;transform:scaleY(.12);transform-origin:50% 44px}
.kitty.m-rest .kbody{animation:kbreathe 3.4s ease-in-out infinite}
.kitty.m-rest .kz1{animation:kzf 2.6s ease-out infinite}
.kitty.m-rest .kz2{animation:kzf 2.6s ease-out .5s infinite}
.kitty.m-rest .kz3{animation:kzf 2.6s ease-out 1s infinite}
@keyframes kbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes kzf{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}
/* shine — for scripture and big wins */
.kitty.m-shine .kstars{display:block;animation:ktw 1.8s ease-in-out infinite}
.kitty.m-shine .kcrown{animation:kglow 2.2s ease-in-out infinite}
@keyframes ktw{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
@keyframes kglow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px #FFD166)}}
/* point — at the work */
.kitty.m-point .kpawR{transform-origin:62px 100px;animation:kpoint 1.3s ease-in-out infinite}
@keyframes kpoint{0%,100%{transform:translate(6px,-18px) rotate(-28deg)}50%{transform:translate(13px,-24px) rotate(-38deg)}}
.kmood{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#B33684;background:#FFE3F1;border-radius:999px;padding:2px 9px;margin-bottom:6px}
.kbub{position:relative;max-width:min(300px,calc(100vw - 140px));margin-bottom:58px;background:#fff;color:#3B2550;border:2px solid #F7A8CF;border-radius:18px 18px 18px 4px;padding:12px 14px 10px;box-shadow:0 10px 28px rgba(179,54,132,.22);font-size:14.5px;line-height:1.45;opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s .25s,transform .35s .25s cubic-bezier(.34,1.56,.64,1)}
.kitty.show .kbub{opacity:1;transform:scale(1)}
.kbub q{quotes:"\201C" "\201D"}
.kbub .kref{display:block;margin-top:5px;font-size:12.5px;font-weight:800;color:#C2185B}
.kbub .kx{all:unset;pointer-events:auto;cursor:var(--cur-pointer);position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;background:#E8479B;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.kbub .krow{display:flex;gap:12px;margin-top:8px;font-size:12px}
.kbub .krow button{all:unset;pointer-events:auto;cursor:var(--cur-pointer);color:#B33684;font-weight:700;text-decoration:underline;text-underline-offset:2px}
@media (prefers-reduced-motion:reduce){.kitty,.kbub{transition:opacity .2s!important}.kitty *{animation:none!important}}
.rnhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rnhead h2{margin:0;font-size:17px;flex:1}
.rnhead .x{background:none;border:0;font-size:20px;cursor:var(--cur-pointer);color:var(--muted);padding:2px 6px}
.rnsub{font-size:12px;color:var(--muted);padding:6px 14px 0}
.rnlist{overflow:auto;padding:6px 8px 10px}
.rngrp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 6px 4px}
.rnrow{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:10px;cursor:var(--cur-pointer)}
.rnrow:hover{background:var(--bg)}
.rnrow input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px;cursor:var(--cur-pointer)}
.rnrow .t{font-weight:700;font-size:14px;line-height:1.3}
.rnrow .n{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.rnrow.done .t{text-decoration:line-through;opacity:.55}
.rnrow .late{color:var(--late);font-weight:700}
.rnempty{padding:18px 14px;color:var(--muted);font-size:14px}
footer{padding-bottom:90px!important}
@media (max-width:899px){ .rnpanel{right:8px;left:8px;width:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px))} }

/* Quick budget */
.pvwrap{display:grid;gap:10px}
.pvhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pvsheet{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff;color:#1E1430}
.pvtab{background:#E7F0E9;color:#1E6B3A;font-size:12px;font-weight:700;padding:5px 10px;border-bottom:1px solid #cfd8d2}
table.pv{border-collapse:collapse;width:100%;font:14px Calibri,Aptos,"Segoe UI",sans-serif;min-width:420px}
table.pv td,table.pv th{border:1px solid #d9d9d9;padding:4px 8px}
table.pv td:last-child{text-align:right;white-space:nowrap;width:30%}
table.pv.pv5 td{text-align:right} table.pv.pv5 th{background:#f3f3f3;text-align:left;font-size:13px}
table.pv tr.in td:last-child{background:#FFF2CC}
table.pv tr.pvsec td{font-weight:700;background:#f3f3f3}
table.pv tr.tot td{background:#EAF1FB}
table.pv tr.pvgap td{border:0;height:8px}

.bq{margin-top:14px;display:grid;gap:14px}
.bqcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px}
.bqcard h2{margin:0 0 4px;font-size:19px}
.bqcard .sub{font-size:14px;color:var(--muted);margin:0 0 12px}
.bqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bqgrid label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.bqgrid input,.bqgrid select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px}
.bqgrid input:focus,.bqgrid select:focus{border-color:var(--accent);outline:none}
.bqbig input{font-size:17px;font-weight:700}
.bqadv summary{cursor:var(--cur-pointer);font-weight:700;font-size:14px;margin-top:12px}
.bqadv .bqgrid{margin-top:10px}
.bqres{display:grid;gap:12px}
.bqstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bqstat{background:var(--bg);border-radius:10px;padding:10px 12px}
.bqstat .l{font-size:12px;color:var(--muted);font-weight:700}
.bqstat .v{font-size:22px;font-weight:800;line-height:1.2}
.bqok{border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.bqok.y{background:var(--s-c);color:var(--s-c-t)} .bqok.n{background:var(--late-bg);color:var(--late)}
.bqtab{width:100%;border-collapse:collapse;font-size:14px}
.bqtab th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
.bqtab td{padding:8px;border-bottom:1px solid var(--line)}
.bqempty{color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:13px;padding:24px 0 40px}

/* phone: same columns, stacked */
@media (max-width:899px){
  .thead{display:none}
  .task{grid-template-columns:30px 1fr auto;gap:6px 10px;padding:12px}
  .task>.c-name{grid-column:2/3}
  .task>.acts{grid-column:3;grid-row:1}
  .task>.c-status,.task>.c-who,.task>.c-due,.task>.c-next,.task>.c-dw,.task>.c-lu{grid-column:2/4}
  .lbl{display:inline;font-size:12px;color:var(--muted);font-weight:400;margin-right:4px}
  .c-status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sechead .goal{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- polish pass: calmer surfaces, clearer hierarchy ---------- */
:root{--shadow:0 1px 2px rgba(59,19,102,.06),0 4px 14px rgba(59,19,102,.06);--r-lg:14px;--r-md:10px;--r-sm:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
body{-webkit-font-smoothing:antialiased;font-feature-settings:normal}
.wrap{padding-inline:16px}
header{padding-block:22px 22px}
h1{font-size:28px;font-weight:800}
.date{font-size:14px;opacity:.9;margin-top:6px}
.upd{border-top:0;border-radius:var(--r-lg);padding:14px;box-shadow:0 8px 28px rgba(20,4,40,.28)}
.upd label{font-size:14px;font-weight:600;color:#3B1366}
.upd textarea{border-width:1.5px;border-radius:var(--r-md);font-size:15px;min-height:64px}
.go,.mic,.stop{height:40px;padding-block:0;border-radius:var(--r-md);font-size:14px}
.hint{font-size:13px}
/* filter bar: one tidy row that scrolls on phones */
.bar{gap:6px;margin-block:18px 6px}
.count{height:34px;display:inline-flex;align-items:center;gap:5px;padding-inline:12px;font-size:13px;font-weight:500;border-color:var(--line);box-shadow:none}
.count b{font-weight:700;font-variant-numeric:tabular-nums}
.seg{height:34px;align-items:stretch}
.seg button{font-size:13px;font-weight:500;padding-inline:12px}
.bar select{height:34px;font-size:13px}
@media (max-width:899px){
  .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:-16px;padding-inline:16px}
  .bar::-webkit-scrollbar{display:none}
  .bar>*{flex:0 0 auto}
  .spacer{display:none}
}
/* category sections: tinted header with a color stripe instead of a loud bar */
.sec{border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-top:20px}
.sechead{background:var(--tint)!important;color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;font-size:15px;padding:12px 16px;border-bottom:1px solid var(--line);box-shadow:inset 5px 0 0 var(--ch)}
.sec.closed .sechead{border-bottom:0}
.sechead .n{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;opacity:1;font-variant-numeric:tabular-nums}
.sechead .goal{font-size:12px;color:var(--muted);opacity:1}
.caret{color:var(--muted);font-size:12px}
/* rows */
.thead{font-size:11px;letter-spacing:.06em;padding-block:8px;background:var(--surface)}
.task{background:var(--surface);padding-block:12px;transition:background .12s}
.task:hover{background:var(--tint)}
.tname{font-size:15px;font-weight:600;line-height:1.35}
.next{font-weight:600;color:var(--ink)}
.c-who,.c-dw,.c-lu{font-size:14px;color:var(--ink)}
.c-due{font-size:14px;font-variant-numeric:tabular-nums}
.lu-date{font-size:11.5px;margin-top:2px}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.star{font-size:17px}
.handle{font-size:16px;opacity:.6}
.handle:hover{opacity:1}
.notes summary{font-size:12.5px;color:var(--muted)}
.acts{gap:6px}
.donebtn,.editbtn{height:30px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;padding-inline:10px}
.editbtn{background:var(--surface);border-color:var(--line)}
.chk{width:24px;height:24px;font-size:12px;border-width:1.5px}
.edit{border-radius:var(--r-md);background:var(--bg)}
/* results, feed, calendar, partners share the same card language */
.result{border-left-width:4px;border-radius:var(--r-lg);box-shadow:var(--shadow)}
.citem,.chg{border-radius:var(--r-md)}
.cal{border-radius:var(--r-lg);box-shadow:var(--shadow)}
.calhead h2{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;font-size:18px}
.pgroup h2,.feed h3,.day h3,.agenda h3{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}
.pcard{border-radius:var(--r-lg);box-shadow:var(--shadow);border-left-width:4px}
.pname{font-weight:600;font-size:15px}
.pbtn{height:34px;display:inline-flex;align-items:center;border-radius:var(--r-sm);font-size:13px;font-weight:500}
.mail{border-radius:var(--r-md);font-size:14px;line-height:1.55}
.toast{font-weight:500;box-shadow:var(--shadow)}
footer{font-size:12.5px;line-height:1.6;max-width:72ch}
@media (max-width:899px){
  .task{padding:14px 14px;gap:6px 10px}
  .sechead{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){.task{transition:none}}
.count,.seg button{text-transform:uppercase;letter-spacing:.045em;font-size:12px;font-weight:600}
.count b{font-size:13px}
/* summary rows that expand on tap */
.thead,.task{grid-template-columns:30px minmax(0,2.2fr) minmax(0,1.6fr) 96px!important;gap:12px!important;align-items:center}
.task{cursor:default}
.sum{display:flex;flex-direction:column;gap:5px;min-width:0;cursor:var(--cur-pointer);border-radius:8px}
.sum:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sumtop{display:flex;align-items:flex-start;gap:2px;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .lateTxt{color:var(--late);font-weight:700}
.c-next{font-size:14px;cursor:var(--cur-pointer);min-width:0}
.chev{display:inline-block;color:var(--accent);font-size:14px;transition:transform .15s;margin-left:2px}
.closebtn{margin-left:auto}
.task.open .chev{transform:rotate(90deg)}
.more{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-left:42px}
.more .k{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.more .v{font-size:14px;white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.more .full{grid-column:1/-1}
.more .row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.acts{flex-direction:column}
@media (max-width:899px){
  .task{grid-template-columns:26px minmax(0,1fr) auto!important;gap:8px 10px!important;align-items:start}
  .task>.c-next{grid-column:2/4}
  .more{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.donow{margin-top:18px}
.donow h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.dn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dncard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow);min-width:0;cursor:var(--cur-pointer)}
.dncard .why{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--late)}
.dncard .why.star{color:var(--accent)} .dncard .why.wait{color:var(--s-w-t)} .dncard .why.soon{color:var(--s-ip-t)}
.dncard .t{font-weight:600;font-size:14.5px;line-height:1.35}
.dncard .n{font-size:13px;color:var(--muted)}
.dncard .donebtn{align-self:flex-start;margin-top:auto}
.nudge{background:var(--s-w);color:var(--s-w-t)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.copybox{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;font-size:14px;line-height:1.55;margin-top:8px}
@media (max-width:899px){ .dn{grid-template-columns:1fr} }
.finbar{display:flex;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--s-c-t);cursor:var(--cur-pointer);text-align:left}
.finbar:hover{background:var(--tint)}
.finbar[aria-expanded="true"] .chev{transform:rotate(90deg)}
.fincount{background:var(--s-c);color:var(--s-c-t);border-radius:999px;padding:0 8px;font-size:12px}
.finlist .task{background:var(--surface)}
.task.done .tname{color:var(--muted)}
.hz{display:flex;gap:6px;align-items:stretch;margin-top:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hz::-webkit-scrollbar{display:none}
.hzt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:84px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);cursor:var(--cur-pointer);text-align:left}
.hzt b{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hzt span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hzt.haslate b{color:var(--late)}
.hzt[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:#fff}
.hzt[aria-pressed="true"] span{color:#E8C9F2}
.hzt[aria-pressed="true"].haslate b{color:#FFB3A8}
.hznote{align-self:center;font-size:12px;color:var(--late);font-weight:600;padding-left:6px;white-space:nowrap}
@media (max-width:899px){ .hz{margin-inline:-16px;padding-inline:16px} }
/* clarity pass */
.upd{padding:12px 14px}
.upd label{margin-bottom:6px}
.upd textarea{min-height:48px!important}
.updbar{margin-top:8px}
.hint{display:none}
.views{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;margin-top:18px}
.gcard{border:1px solid var(--line);border-left:6px solid var(--ch);background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.secf{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 2px}
.secf button{height:28px;padding-inline:10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:var(--cur-pointer)}
.secf button[aria-pressed="true"]{background:var(--ch);border-color:var(--ch);color:#fff}
.gcard h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.gcard .gtext{font-size:14px;color:var(--muted)}
.gcard .gtext b{color:var(--ink)}
.vt{all:unset;box-sizing:border-box;cursor:var(--cur-pointer);display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 2px 8px;border-radius:14px;text-align:center;-webkit-tap-highlight-color:transparent}
.vt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vt .vi{position:relative;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;box-shadow:0 4px 12px rgba(30,20,48,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
.vt:hover .vi{transform:translateY(-2px) scale(1.04)}
.vt:active .vi{transform:scale(.96)}
.vt .vl{font-size:12.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.vt .vn{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#fff;color:#2E2244;border:1.5px solid var(--line);font-size:11px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.vt[aria-pressed="true"] .vi{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent),0 6px 14px rgba(30,20,48,.25)}
.vt[aria-pressed="true"] .vl{font-weight:800;color:var(--accent)}
.hz{margin-top:12px}
.bar{margin-block:14px 4px;align-items:center}
.barlbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.count{height:30px}
.donow{margin-top:14px}
@media (max-width:899px){ .views{gap:14px 6px} }



/* meetings */
.meet{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid #7FB2E5;border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow)}
.meet h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.meet h2 .r{margin-left:auto;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.mrow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.mrow.past{opacity:.55}
.mrow.now .tm{color:var(--accent)}
.mrow .who{font-size:12.5px;color:var(--muted)}
.mrow .mb{display:flex;gap:6px}
.mrow .mb a{font-size:12.5px;padding:4px 10px;height:auto}
.ev.mev{background:#EDF4FC;border-left-color:#7FB2E5;color:#1E3A5F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev.mev{background:#18283C;color:#C9DDF5}}
@media (max-width:899px){ .mrow{grid-template-columns:70px minmax(0,1fr)} .mrow .mb{grid-column:2} }
/* partner budget + msa */
.ppanel{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-md);background:var(--bg);padding:12px 14px;display:grid;gap:10px}
.ppanel h3{margin:0;font-size:15px}
.ppanel .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ppanel label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:600}
.ppanel input,.ppanel textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
.ppanel input.empty{border-color:var(--accent);background:#FFF6FB}
.ppanel textarea{min-height:56px;resize:vertical}
.btotal{font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btotal b{font-size:18px}
.btotal table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.btotal td{padding:3px 0;border-top:1px solid var(--line)}
.btotal td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pnote{font-size:12.5px;color:var(--muted)}
/* slides + links */
@media (max-width:899px){ .views{grid-template-columns:repeat(4,minmax(0,1fr))!important} }
.slwrap{margin-top:14px;display:grid;gap:14px}
.slcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.slcard h2{font-size:17px;margin:0 0 4px}
.slcard .lead{font-size:13px;color:var(--muted);margin:0 0 10px}
.slform{display:grid;gap:10px}
.slform label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:600}
.slform input,.slform select,.slform textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.slform textarea{min-height:64px;resize:vertical}
.slrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.deck:first-of-type{border-top:0}
.deck .nm{font-weight:700}
.deck .sub{font-size:12.5px;color:var(--muted)}
.deck .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--s-ip);color:var(--s-ip-t);margin-left:6px}
.tag.gen{background:var(--s-c);color:var(--s-c-t)}
.tag.run{background:var(--s-w);color:var(--s-w-t)}
.slstatus{font-size:14px;border-radius:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line)}
.slstatus.err{background:var(--late-bg);color:var(--late);border-color:transparent}
.pics{display:flex;gap:8px;flex-wrap:wrap}
.pics img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.linkrow:first-of-type{border-top:0}
.linkrow .what{font-weight:700}
.linkrow .src{font-size:12px;color:var(--muted)}
.linkrow .miss{color:var(--late);font-weight:600;font-size:13px}
/* find & save */
.refwrap{margin-top:14px;display:grid;gap:14px}
.refsearch{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:15px}
.refsearch:focus{border-color:var(--accent);outline:none}
.refsec{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px}
.refsec h2{font-size:17px;margin:0 0 4px}
.refsec .lead{font-size:13px;color:var(--muted);margin:0 0 8px}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.ritem:first-of-type{border-top:0}
.ritem .what{font-weight:700}
.ritem .where{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;word-break:break-word;grid-column:1/2}
.ritem .src{font-size:12px;color:var(--muted);grid-column:1/2}
.ritem .where a{color:var(--head2,#5A1E8C);font-weight:700}
.cpy{grid-column:2;grid-row:1/4;align-self:center;border:1px solid var(--accent);background:#FFE3F1;color:#7A1449;border-radius:8px;padding:5px 10px;cursor:var(--cur-pointer);font-size:13px;white-space:nowrap}
.refnote{font-size:13px;color:var(--muted)}
.refsteps{margin:4px 0 0;padding-left:20px}
.refsteps li{margin:4px 0}
/* partners: Smartsheet-style table (ST Partners - IL view) */
.ptwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);max-height:75vh}
table.pt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:1500px;width:100%}
table.pt th{position:sticky;top:0;z-index:2;background:#8A8A8A;color:#fff;font-weight:500;text-align:left;padding:8px 10px;white-space:nowrap;border-right:1px solid #9d9d9d}
table.pt td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;white-space:pre-line;overflow-wrap:anywhere}
table.pt td.num{color:var(--muted);font-size:11px;text-align:right;width:28px;background:var(--surface)}
table.pt .c-org{position:sticky;left:0;z-index:1;background:var(--surface);min-width:240px;font-weight:600;cursor:var(--cur-pointer)}
table.pt th.c-org{z-index:3;background:#8A8A8A;font-weight:700}
table.pt .c-org:hover{color:var(--accent)}
table.pt tr.open td:not(.pri1):not(.pri2):not(.pri3){background:var(--tint,#FDE9F3)}
table.pt td.pri{text-align:center;font-weight:600;width:90px}
table.pt td.pri1{background:#1565C8;color:#fff} table.pt td.pri2{background:#5AB0F5;color:#0B2540} table.pt td.pri3{background:#BBDDFB;color:#0B2540}
table.pt td.reach{background:#E3F1FD;color:#0B2540}
table.pt tr.pgrp td{position:sticky;left:0;background:var(--bg);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
table.pt td.pcell{padding:8px;background:var(--bg)}
table.pt td.pcell .pcard{margin:0;max-width:1100px;position:sticky;left:8px}
.c-next2{min-width:280px} .c-sum{min-width:300px}
/* task list: highlight -> preview -> expand */
.thead,.task{grid-template-columns:30px minmax(0,1fr) 96px!important}
@media (max-width:899px){.task{grid-template-columns:26px minmax(0,1fr) auto!important}}
.task.today{box-shadow:inset 4px 0 0 var(--s-ip-t)}
.task.sel{background:color-mix(in srgb,var(--accent) 9%,var(--surface));box-shadow:inset 4px 0 0 var(--accent)}
.task.sel .tname{color:var(--ink)}
.tflag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tflag.late{background:var(--late-bg);color:var(--late)}
.tflag.today{background:var(--s-ip);color:var(--s-ip-t)}
.tflag.wait{background:var(--s-w);color:var(--s-w-t)}
.tprev{grid-column:1/-1;margin-left:42px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow);animation:tpin .16s ease-out}
@keyframes tpin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tprev .k{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tp-next .v{font-size:16px;font-weight:600;line-height:1.4}
.tp-meta{display:grid;grid-template-columns:140px 160px minmax(0,1fr);gap:10px 18px;font-size:14px}
.tp-meta .v{overflow-wrap:anywhere}
.tprev .row{display:flex;gap:8px;flex-wrap:wrap}
.tp-go{background:var(--head)!important;color:#fff!important;border-color:var(--head)!important}
@media (max-width:899px){.tprev{margin-left:0}.tp-meta{grid-template-columns:1fr 1fr}.tp-lu{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.tprev{animation:none}}
/* ---- Partner CRM (pipeline = Smartsheet "Partner Status" 1–6) ---- */
:root{--ss1:#9AA3B5;--ss2:#8B7FD1;--ss3:#B36BD6;--ss4:#E06AAE;--ss5:#E8479B;--ss6:#2E9E5B;--p1:#E8479B;--p2:#B36BD6;--p3:#9AA3B5;--chipbg:#F6EEF8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ss1:#7D879B;--ss2:#9C90E6;--ss3:#C98BE6;--ss4:#F28BC4;--ss5:#FF6FB5;--ss6:#5CC88A;--p1:#FF6FB5;--p2:#C98BE6;--p3:#7D879B;--chipbg:#2C1D3B}}
:root[data-theme="dark"]{--ss1:#7D879B;--ss2:#9C90E6;--ss3:#C98BE6;--ss4:#F28BC4;--ss5:#FF6FB5;--ss6:#5CC88A;--p1:#FF6FB5;--p2:#C98BE6;--p3:#7D879B;--chipbg:#2C1D3B}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;gap:4px;margin:0 0 18px}
.pipe button{all:unset;cursor:var(--cur-pointer);display:flex;flex-direction:column;gap:2px;padding:10px 12px 9px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sc);border-radius:10px;min-width:0}
.pipe button b{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.pipe button span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe button[aria-pressed="true"]{background:var(--sc);border-color:var(--sc)} .pipe button[aria-pressed="true"] b,.pipe button[aria-pressed="true"] span{color:#fff}
.pipe button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:899px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prow{grid-template-columns:minmax(0,1.5fr) auto auto minmax(0,1.6fr) auto!important}
.prow:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
@media (max-width:899px){.prow{grid-template-columns:minmax(0,1fr) auto auto!important}.prow .pnext,.prow .pwhen{grid-column:1/-1}.kv{grid-template-columns:96px minmax(0,1fr)}}
.pcard{border-left-color:var(--sc,var(--line))!important}
.sschip{all:unset;cursor:var(--cur-pointer);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;background:var(--chipbg);color:var(--ink);white-space:nowrap;border:1px solid var(--line)}

/* "More" sheet */
.sheet{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,4,40,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fadein .2s}
.sheet>div{width:min(680px,100%);max-height:85vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;padding:14px 16px calc(26px + env(safe-area-inset-bottom,0px));animation:sheetup .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px rgba(20,4,40,.3)}
@keyframes sheetup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:4px 0 2px;font-size:18px}
.sheet .sub{font-size:13px;color:var(--muted);margin:0 0 6px}
.sheet .views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 6px;margin-top:12px}
@media (min-width:600px){.sheet .views{grid-template-columns:repeat(6,minmax(0,1fr))}}
/* Home */
.home{display:grid;gap:14px;margin-top:16px}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hero h2{margin:0;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.hero .sub{color:var(--muted);font-size:14px;margin-top:3px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.qk{all:unset;cursor:var(--cur-pointer);display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;white-space:nowrap}
.qk:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 20px rgba(232,71,155,.18)}
.qk:active{transform:scale(.95)}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.hstat{all:unset;box-sizing:border-box;cursor:var(--cur-pointer);display:flex;flex-direction:column;gap:3px;padding:14px 14px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;min-width:0}
.hstat::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--hc,var(--grad))}
.hstat:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(59,19,102,.14)}
.hstat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hstat b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.hstat.warn b{color:var(--late)}
.hstat span{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hstat small{font-size:12px;color:var(--muted);font-weight:500}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.hwide{grid-column:1/-1}
.tkind{display:grid;gap:6px} .walk{grid-column:1/-1;margin-top:10px;padding:12px;border-radius:14px;border:1px dashed var(--line);background:var(--surface2,var(--surface))} .wsteps{display:grid;gap:6px;margin-top:10px} .wstep{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)} .wstep.ok{border-color:#2E7D32;background:rgba(46,125,50,.08)} .wstep.err{border-color:#B42318;background:rgba(180,35,24,.08)} .wstep .wl{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px} .wstep .wb{display:flex;gap:4px;flex-shrink:0} .wstep input{margin-top:6px;width:100%} .pbtn.bad{background:#B42318;color:#fff;border-color:#B42318} .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface2,var(--line));color:var(--muted);margin-left:4px}
.plan-run{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:6px} .plan-run li{display:flex;gap:8px;align-items:flex-start;font-size:14px} .plan-run li.err{color:#B42318} .chatlog{display:grid;gap:6px} .chatlog div{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface2,var(--surface));border:1px solid var(--line)} .chatlog div.user{background:var(--surface)} #selfRules{width:100%;margin-top:6px}
.savchart .dring{stroke:var(--line)} .savchart .dsave{stroke:var(--accent)}
.savchart .ddot{fill:var(--accent);opacity:.55} .savchart .dtrack{fill:var(--line)} .savchart .dfill{fill:var(--accent)}
.savchart .dpct{font:800 54px "Plus Jakarta Sans",system-ui,sans-serif;fill:var(--ink);letter-spacing:-.02em}
.savchart .dlbl{font:600 17px "Plus Jakarta Sans",system-ui,sans-serif;fill:var(--muted)}
.savchart .dsub,.savchart .dsub2{font:500 15px "Plus Jakarta Sans",system-ui,sans-serif;fill:var(--muted)}
.savchart .dkey{font:700 13px "Plus Jakarta Sans",system-ui,sans-serif;fill:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.savchart .dval{font:800 30px "Plus Jakarta Sans",system-ui,sans-serif;fill:var(--ink);font-variant-numeric:tabular-nums}
.savstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0} .savstats div{padding:10px;border-radius:12px;background:var(--surface2,var(--surface));border:1px solid var(--line);text-align:center} .savstats b{display:block;font-size:20px;color:var(--accent)} .savstats span{font-size:12px;color:var(--muted)} .savchart{width:100%;height:auto;background:var(--surface2,var(--surface));border-radius:12px;border:1px solid var(--line)} .savchart .grid{stroke:var(--line);stroke-width:1} .savchart .ax{font-size:11px;fill:var(--muted)} .savchart rect{fill:var(--accent);transition:opacity .15s} .savchart rect:hover{opacity:.7}
.acctgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-top:4px}
.acct{position:relative;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.acct.used{opacity:.55;border-style:dashed}
.acctb{all:unset;cursor:var(--cur-pointer);flex:1;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:700;letter-spacing:.02em}
.acctb:hover{background:var(--tint,#FDE9F3)}
.acctb:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.acct.used .acctb{text-decoration:line-through}
.acctx{all:unset;cursor:var(--cur-pointer);padding:0 10px;color:var(--accent);font-size:15px;font-weight:800}
.acctn{font-size:13px;font-weight:600;color:var(--muted);margin-left:8px}
.aminbox{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2,var(--surface));border:1px solid var(--line);margin:10px 0} .aminbox .ic{font-size:22px} .aminbox code{font-size:13px;user-select:all;word-break:break-all} .aminbox>div{flex:1;min-width:0}
.tchecks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.tchk{display:flex;gap:8px;align-items:center;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tchk input{width:18px;height:18px;accent-color:var(--accent)}
.tres{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:13px} .tres li.ok{color:var(--s-c-t)} .tres li.bad{color:var(--late)}
.hsecs{display:grid;gap:12px;margin-top:14px}
.hsec{padding:4px 10px 4px 12px;gap:0}
.hsec.open{padding-bottom:14px;gap:10px}
.hsh{display:flex;align-items:center;gap:6px;margin:0;min-height:44px}
.htog{all:unset;cursor:var(--cur-pointer);display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:15px;font-weight:800;color:var(--ink);padding:8px 0;letter-spacing:0;text-transform:none}
.htog .car{width:14px;color:var(--muted);font-size:13px} .htog .hic{font-size:18px}
.htog .n{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:12px;font-weight:700;color:var(--muted)}
.htog:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.hrt{display:flex;gap:4px;align-items:center} .harrows{display:flex;gap:2px}
.hdrag{cursor:grab;color:var(--muted);font-size:18px;padding:8px 4px 8px 8px;touch-action:none;user-select:none;-webkit-user-select:none}
.hsec.dragging{opacity:.6;transform:scale(.99);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.home.arranging .hsec{border-style:dashed}
.harr{height:34px;align-self:flex-start;background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:var(--shadow)}
.hsb{min-width:0}
.hassist{all:unset;box-sizing:border-box;cursor:var(--cur-pointer);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;box-shadow:var(--shadow)}
.hassist .ha-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--grad);box-shadow:0 6px 16px rgba(179,54,132,.3)}
.hassist .ha-t{display:flex;flex-direction:column;gap:2px;min-width:0} .hassist .ha-t b{font-size:17px;color:var(--ink)} .hassist .ha-t span{font-size:13.5px;color:var(--muted)}
.hassist .ha-go{font-weight:800;color:var(--accent);white-space:nowrap} .hassist:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tool{all:unset;cursor:var(--cur-pointer);display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 11px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;transition:transform .15s,border-color .15s}
.tool:hover{transform:translateY(-2px);border-color:var(--accent)} .tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tool .ti{font-size:22px;line-height:1} .tool b{font-size:13px;color:var(--ink);margin-top:4px} .tool .ts{font-size:11px;color:var(--muted);line-height:1.2}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;box-shadow:var(--shadow);display:grid;gap:10px;min-width:0}
.hcard.glow{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.hcard>h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.hcard>h3 .n{font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.hcard>h3 .r{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--accent);cursor:var(--cur-pointer);background:none;border:0;padding:0}
.hcard .emptyx{font-size:13.5px;color:var(--muted)}
.hcard .wide{grid-column:1/-1}
/* suggestion rows (Home + Assistant) */
.sug{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px 12px;padding:12px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--line);align-items:start;transition:transform .15s,box-shadow .15s,border-color .15s}
.sug:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.sug .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--surface);box-shadow:var(--shadow)}
.sug.k-tasks .ic{background:linear-gradient(135deg,#FFE3F1,#FDE9F3)} .sug.k-partners .ic{background:linear-gradient(135deg,#DDF8F6,#E6F3FB)} .sug.k-kit .ic{background:linear-gradient(135deg,#FFF3D6,#FDE9F3)} .sug.k-admin .ic{background:linear-gradient(135deg,#F4EFFB,#ECDDFB)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sug .ic{background:var(--surface)!important}}
:root[data-theme="dark"] .sug .ic{background:var(--surface)!important}
.sug .t{font-weight:700;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.sug .w{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.sug .acts{grid-column:2;display:flex!important;flex-direction:row!important;gap:6px;flex-wrap:wrap;align-items:center}
.sug .acts .qbtn{height:30px;font-size:12.5px;padding:0 11px}
.sug .acts .qbtn.p{background:var(--grad);color:#fff;border-color:transparent}
.sug.gone{animation:sugout .35s ease-in forwards}
@keyframes sugout{to{opacity:0;transform:translateX(40px) scale(.95);height:0;padding:0;margin:0}}
.sug .pr{position:absolute}
/* Assistant */
.agent{display:grid;gap:14px;margin-top:16px}
.ahero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;color:#fff;background:var(--grad);box-shadow:0 14px 36px rgba(122,30,108,.35)}
.ahero::after{content:"";position:absolute;inset:-40% -20%;background:radial-gradient(30% 40% at 80% 20%,rgba(255,255,255,.25),transparent 60%),radial-gradient(25% 35% at 20% 90%,rgba(255,255,255,.18),transparent 60%);animation:mesh 14s ease-in-out infinite alternate;pointer-events:none}
.ahero>*{position:relative;z-index:1}
.ahero .bot{font-size:44px;line-height:1;display:inline-block;animation:botbob 3s ease-in-out infinite}
@keyframes botbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.ahero h2{margin:6px 0 2px;font-size:24px;letter-spacing:-.02em}
.ahero p{margin:0;opacity:.92;font-size:14px;max-width:60ch}
.ahero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ahero .pbtn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.ahero .pbtn.main{background:#fff!important;color:#7A1E6C!important;background-image:none!important}
.ahero .pbtn.main:hover{box-shadow:0 6px 18px rgba(0,0,0,.2)}
.plan{display:grid;gap:8px}
.plan .pi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.plan .pi .num{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}
.plan .pi .t{font-weight:700;font-size:14px}
.plan .pi .b{font-size:13px;color:var(--muted);margin-top:2px}
.plan .pi.done .t{text-decoration:line-through;opacity:.55}
.plan .pi .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.plannote{font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.thinking{display:inline-flex;gap:4px;align-items:center}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dots 1.2s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes dots{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-5px);opacity:1}}
.agsec{display:grid;gap:8px}
.agsec h3{margin:6px 0 0;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.agsec h3 .n{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.auto{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.auto .ic{font-size:20px;text-align:center}
.auto .t{font-weight:700;font-size:14px}
.auto .w{font-size:12.5px;color:var(--muted)}
.auto .st{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--s-c);color:var(--s-c-t);white-space:nowrap}
.auto .st.soon{background:var(--s-ip);color:var(--s-ip-t)}
.auto .st.off{background:var(--s-ns);color:var(--s-ns-t)}
.auto .st.live{animation:latepulse 2.4s ease-in-out infinite}
.aglog{display:grid;gap:4px;font-size:13px}
.aglog div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.aglog div:first-child{border-top:0}
.aglog .when{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.apicode{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--head);color:#F3EAF7;border-radius:12px;padding:12px 14px;overflow:auto;line-height:1.55;white-space:pre}
/* ⌘K palette */
.cmdk{position:fixed;inset:0;z-index:60;background:rgba(20,4,40,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:max(8vh,env(safe-area-inset-top,0px)) 16px 16px;animation:fadein .15s}
.cmdk>div{width:min(640px,100%);background:var(--surface);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(20,4,40,.4);animation:pop .3s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--line)}
.cmdk .in{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 16px;border-bottom:1px solid var(--line)}
.cmdk .in span{font-size:18px}
.cmdk input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:17px;font-weight:600;outline:none;color:var(--ink)}
.cmdk .in kbd{font:600 11px/1 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--muted);border:1px solid var(--line);padding:4px 6px;border-radius:6px}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:min(52vh,460px);overflow:auto}
.cmdk li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:var(--cur-pointer)}
.cmdk li[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.cmdk li .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--bg)}
.cmdk li .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk li .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk li .k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-radius:6px;padding:2px 7px;white-space:nowrap}
.cmdk .hint{padding:8px 14px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap}
.cmdk .hint kbd{font:600 11px/1 "Plus Jakarta Sans",system-ui,sans-serif;border:1px solid var(--line);padding:2px 5px;border-radius:5px;margin-right:3px}
/* partner kit */
.kit{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.kit i{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.kit i.ok{background:var(--s-c);color:var(--s-c-t);border-color:transparent}
.kitbar{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.kitfold{all:unset;cursor:var(--cur-pointer);display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--s-w);color:var(--s-w-t);border:1px solid color-mix(in srgb,var(--s-w-t) 25%,transparent)}
.kitfold.done{background:var(--s-c);color:var(--s-c-t);border-color:color-mix(in srgb,var(--s-c-t) 25%,transparent)}
.kitfold:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kst{display:block;font-size:11.5px;font-weight:700;margin-top:2px} .kst.ok{color:var(--s-c-t)} .kst.todo{color:var(--s-w-t)}
.kitbar .ksteps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.kstep{all:unset;cursor:var(--cur-pointer);display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);transition:transform .15s,border-color .15s}
.kstep:hover{transform:translateY(-2px);border-color:var(--accent)}
.kstep.ok{border-color:var(--s-c-t);background:var(--s-c)}
.kstep .kl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kstep.ok .kl{color:var(--s-c-t)}
.kstep .kv{font-size:14px;font-weight:700}
