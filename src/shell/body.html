<body>
<header>
  <div class="hfloat" aria-hidden="true"><i style="left:6%;font-size:14px;animation-duration:11s;animation-delay:0s">✨</i><i style="left:18%;font-size:12px;animation-duration:14s;animation-delay:3s">💗</i><i style="left:34%;font-size:16px;animation-duration:12s;animation-delay:6s">🦋</i><i style="left:52%;font-size:12px;animation-duration:15s;animation-delay:1.5s">✨</i><i style="left:67%;font-size:13px;animation-duration:13s;animation-delay:4.5s">💖</i><i style="left:81%;font-size:15px;animation-duration:16s;animation-delay:8s">☀️</i><i style="left:93%;font-size:12px;animation-duration:12s;animation-delay:2s">✨</i></div>
  <div class="wrap">
    <div class="toprow">
      <div class="brand" id="brandHome" role="button" tabindex="0" title="Home" style="cursor:pointer"><span class="logo" aria-hidden="true">☀️</span><div><h1>Workstream <span aria-hidden="true">🦋</span></h1><p class="date" id="today"></p></div></div>
      <div class="hbtns"><button class="hbtn" id="themeBtn" type="button" aria-label="Switch theme">🌗</button><button class="hbtn srch" id="cmdkBtn" type="button" aria-label="Search">🔎 Search</button><button class="hbtn" type="button" data-hview="cal">📅 Meetings</button><button class="hbtn" type="button" data-hview="teams">💬 Teams</button><button class="hbtn" type="button" data-hview="list">📋 Tasks</button><button class="hbtn" id="recapBtn" title="Your Friday update for Teams">✨ Weekly recap</button><button class="hbtn" id="exportBtn" hidden>📤 Download priority items</button></div>
    </div>
    <form class="upd" id="updForm">
      <label for="updText">🤖 Ask the assistant</label>
      <textarea id="updText" rows="2" placeholder="Tell me what to do"></textarea>
      <div class="updbar">
        <button class="mic" id="micBtn" type="button" aria-pressed="false">🎤 Talk</button>
        <button class="go" id="goBtn" type="submit">✨ Do it</button>
        <button class="stop" id="stopBtn" type="button" hidden>Stop</button>
        <span class="hint" id="hint">It runs every step itself: cards, links, flyers, decks, emails (three versions), tasks, tests.</span>
      </div>
      <div class="micnote" id="micNote" hidden></div>
    </form>
  </div>
</header>

<main class="wrap">
  <div id="status"></div>
  <div id="result"></div>
  <nav id="views" class="views" aria-label="Sections"></nav>
  <nav id="hz" class="hz" aria-label="Time range"></nav>
  <div id="meet"></div>
  <div id="donow"></div>
  <div class="bar" id="bar"></div>
  <div id="psw"></div>
  <div id="list"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
