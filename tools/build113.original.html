.wave{display:none;align-items:center;gap:3px;height:22px;margin-left:4px}
.mic.rec+.wave,.updbar.rec .wave{display:inline-flex}
.wave i{display:block;width:3px;border-radius:2px;background:var(--accent);height:8px;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}
@keyframes wv{0%,100%{height:6px}50%{height:22px}}
/* up next */
.upnext{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--grad);color:#fff;box-shadow:0 10px 30px rgba(179,54,132,.3);position:relative;overflow:hidden}
.upnext::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.18) 80%,transparent 90%);animation:spin 7s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.upnext>*{position:relative;z-index:1}
.upnext .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.upnext .t{font-weight:800;font-size:16px;line-height:1.25;text-wrap:balance}
.upnext .s{font-size:12.5px;opacity:.9}
.upnext .tm{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.upnext .pbtn{background:rgba(255,255,255,.18);border-color:transparent;color:#fff;height:34px}
.upnext .pbtn.main{background:#fff;color:#7A1E6C}
@media (max-width:600px){.upnext{grid-template-columns:auto minmax(0,1fr)}.upnext .btns{grid-column:1/-1;display:flex;gap:6px}}
.hcard.glow{position:relative;overflow:hidden}
.hcard.glow::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(120deg,#E8479B,#9B7BE0,#FF8FC4,#5A1E8C,#E8479B);background-size:300% 300%;animation:aurora 9s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}
@keyframes aurora{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.fn::before,.upnext::after,.hcard.glow::before,.skel i,.wave i{animation:none!important}}
/* kits v5 */
.ktypes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.kstep2{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.kstep2:first-child{border-top:0}
.ktick{all:unset;cursor:var(--cur-pointer);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;border:2px solid var(--line);color:var(--muted);background:var(--surface);transition:transform .12s,background .15s}
.ktick:hover{transform:scale(1.1)}
.kstep2.ok .ktick{background:var(--accent);border-color:var(--accent);color:#fff}
.ktick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kstep2 .kt b{display:block;font-size:14px;font-weight:700}
.kstep2 .kt span{font-size:12px;color:var(--muted)}
.kstep2.ok .kt b{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.pflow .fn{flex:1 0 64px;min-width:64px}
.pflow .fn .c{width:26px;height:26px;font-size:12px}
.pflow .fn::before{top:12px}
.pflow .fn.done .c{background:var(--fc);color:#fff;border-color:var(--fc)}
.pflow .fn.zero .c{opacity:.55}
.pflow .fsep{align-self:flex-start;margin-top:4px;color:var(--muted);font-size:14px;flex:none;padding:0 2px}
.pflow .fn .l{font-size:10.5px;max-width:76px;white-space:normal}

const kitType=p=>KITS[p.kitType]?p.kitType:"partner";
const kitSteps=p=>KITS[kitType(p)].steps;
function kitHas(p,k){ if(k==="budget") return !!(p.budget&&(p.budget.savedAt||p.budget.total||p.budget.fileUrl)); if(k==="msa") return !!(p.msa&&p.msa.savedAt); if(k==="deck"||k==="kdeck") return !!p.deckUrl; if(k==="flyer"&&p.flyerUrl) return true;
  if(k==="abp"){ try{ return ABP_STEPS.slice(0,5).every(s=>(p.abp||{})[s[0]]); }catch(_){ return false; } } return !!(p.kit&&p.kit[k]); }
function kitTotal(p){ return kitSteps(p).length; }
function kitDone(p){ return kitSteps(p).filter(([k])=>kitHas(p,k)).length; }
function kitLeft(p){ return kitTotal(p)-kitDone(p); }
function kitNext(p){ const n=kitSteps(p).find(([k])=>!kitHas(p,k)); return n?n[0]:""; }
function kitStep(k,p){ const list=p?kitSteps(p):Object.values(KITS).flatMap(x=>x.steps); return list.find(y=>y[0]===k); }
function kitLabel(k,p){ const x=kitStep(k,p); return x?x[1]+" "+x[2]:""; }
function kitChips(p){ const st=kitSteps(p); const show=st.length>4?st.filter(([k])=>!kitHas(p,k)).slice(0,3):st; return `<span class="kit"><i class="ok" style="opacity:.9">${KITS[kitType(p)].ic} ${kitDone(p)}/${kitTotal(p)}</i>${show.map(([k,ic,l])=>`<i class="${kitHas(p,k)?"ok":""}">${ic} ${l}${kitHas(p,k)?" ✓":""}</i>`).join("")}</span>`; }
function pFlowHTML(p){ const K=KITS[kitType(p)], nx=kitNext(p); const color=kitType(p)==="partner"?"#E09A1F":kitType(p)==="designee"?"#D63384":"#7FB2E5";
  const stage=p.stage||"To email", sIdx=["To email","Emailed","Call set","Active partner"].indexOf(stage), n=SSN(p);
  const node=(l,st,act,title)=>`<button class="fn ${st}" ${act?`data-pact="${act}"`:""} title="${esc(title||l)}"><span class="c">${st==="hot"?"●":st==="done"?"✓":"○"}</span><span class="l">${esc(l)}</span></button>`;
  return `<div class="flow pflow" style="--fc:${color};margin:8px 0 10px"><h3><span aria-hidden="true">🧭</span>${esc(p.org||p.name)} · where this partner is<span class="tot">${kitDone(p)}/${kitTotal(p)} kit · ${n?esc(SSHORT[n-1]):"no status"}</span></h3>
   <div class="fnodes">${["To email","Emailed","Call set","Active partner"].map((l,i)=>node(l,i<sIdx?"done":i===sIdx?"hot":"zero","","Outreach: "+l)).join("")}<span class="fsep" aria-hidden="true">▸</span>${K.steps.map(([k,ic,l])=>{ const ok=kitHas(p,k); return node(ic+" "+l.replace(/ \(.*\)$/,""),ok?"done":k===nx?"hot":"zero","kitact",K.name+": "+l).replace('data-pact="kitact"',`data-pact="kitact" data-v="${k}"`); }).join("")}${n===6?node("Signed","done","","Signed"):""}</div></div>`; }
function kitLink(p,k){ if(k==="deck"||k==="kdeck") return p.deckUrl||""; if(k==="flyer") return p.flyerUrl||""; if(k==="landing"||k==="link") return p.utmLink||""; return ""; }
function kitBarHTML(p){ const on=!!p.needsKit, K=KITS[kitType(p)];

   {id:"reach",ic:"✉️",name:"Outreach",color:"#9B7BE0",total:P.filter(p=>p.stage&&p.stage!=="Not a fit").length,nodes:["To email","Emailed","Call set","Active partner"].map((v,i)=>[v,P.filter(p=>p.stage===v).length,go(()=>{ S.view="partners"; S.pStage=v; S.pSS="all"; S.pQ=""; }),i===3?"end":""])},
   {id:"abp",ic:"📋",name:"Designees (ABP)",color:"#4A7FC0",total:des.length,nodes:[...ABP_STEPS.slice(0,6).map(s=>[s[1].replace(/ (done|signed|submitted|\+ logged|made)$/,"").replace("Consumer protection + enrollment training","Training").replace("Designee Registration Form","Reg. form").replace("Company Information Form","Company form").replace("MES Compliance Plan","MES plan").replace("Sent to Elena","To Elena").replace("ABP name badges","Badges"),desAt(s[0]),go(()=>{ S.view="abp"; })]),["Registered",des.filter(p=>ABP_STEPS.every(s=>(p.abp||{})[s[0]])).length,go(()=>{ S.view="abp"; }),"end"]]},
   {id:"badge",ic:"🪪",name:"Badges",color:"#D63384",total:B.length,nodes:["Needed","Made","Given"].map((v,i)=>[v,B.filter(b=>(b.status||"Needed")===v).length,go(()=>{ S.view="badges"; S.bdgF=v; }),i===2?"end":""])}
  ]; }

async function queueDraft(){ const body=($("aiOut")&&$("aiOut").textContent||"").trim(); if(!body){ toast("Nothing to save yet"); return; } if(!S.db){ toast("Not connected"); return; }
  const c=S.aiCtx||{}; const title=(document.querySelector("#result h3")||{}).textContent||"Draft";

  const extra=vers?{vers,vi:Math.min(sel,vers.length-1),subject:vers[Math.min(sel,vers.length-1)].subj,text:vers[Math.min(sel,vers.length-1)].body}:{};
  try{ await qcol().add({at:new Date().toISOString(),kind:c.kind||"draft",title,to:c.to||"",name:c.name||"",pid:c.pid||"",tid:c.tid||"",body,conf:confOf(body)[0],...extra}); toast("📥 Saved to your Outbox"); agLog("Queued for approval: "+title,{act:"queue"}); }catch(err){ writeErr(err); } }

function isAmb(p){ return !!p&&(p.kitType==="ambassador"||/ambassador/i.test(p.role||"")); }

function obGroup(x){ const p=x.pid&&(S.partners||[]).find(q=>q.id===x.pid); if(p) return isAmb(p)?"amb":"partner"; if(/ambassador/i.test(x.title||"")) return "amb"; if(x.kind==="cp"||x.tid) return "team"; return "other"; }
function obVersions(body){ const parts=String(body||"").split(/^\s*===\s*(.+?)\s*===\s*$/m); const v=[]; for(let i=1;i+1<parts.length;i+=2){ const b=parts[i+1].trim(); if(b) v.push({l:parts[i].trim(),b}); } return v.length>=2?v:null; }
function obSplit(txt){ let body=String(txt||""), subj=""; const m=body.match(/^[ \t]*\**Subject:\**[ \t]*(.+)$/mi); if(m){ subj=m[1].replace(/\*\*/g,"").trim(); body=body.replace(m[0],""); } return {subj,body:body.replace(/^\s+/,"").trim()}; }
function obParts(x){ if(x.subject!=null||x.text!=null) return {subj:x.subject||"",body:x.text||""}; const vs=obVersions(x.body); return obSplit(vs?vs[0].b:x.body); }
function obHtml(t){ return String(t||"").trim().split(/\n{2,}/).map(par=>"<p>"+esc(par).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")+"</p>").join(""); }

async function desRun(d){ d=d||{}; const org=String(d.org||"").trim(); if(!org){ toast("Type the organization first"); return null; } if(!S.db){ toast("Not connected"); return null; }
  const r={busy:true,steps:[],err:""}; S.desRun=r; const step=(t)=>{ const x={t,ok:false,d:""}; r.steps.push(x); desOut(); return x; }; const ok=(x,dd)=>{ x.ok=true; x.d=dd||""; desOut(); };
  const now=new Date().toISOString(); let p=null;
  try{
    let x=step("Partner card: ABP designee + 🪪 Designee enrollment kit");
    const key=org.toLowerCase(); p=(S.partners||[]).find(q=>String(q.org||"").toLowerCase()===key||String(q.name||"").toLowerCase()===key);
    const base={org,name:d.name||org,email:d.email||"",phone:d.phone||"",designee:"Yes",desWho:d.who||"mine",needsKit:true,kitType:"designee",source:"Designee onboarding",notes:[d.utility?"Utility: "+d.utility:"",d.project?"Project: "+d.project:""].filter(Boolean).join(" · ")};
    if(p){ const patch={designee:"Yes",desWho:d.who||"mine",needsKit:true,kitType:"designee",history:pHist(p,"Designee onboarding run (agent)")}; if(d.email&&!p.email) patch.email=d.email; if(d.phone&&!p.phone) patch.phone=d.phone; if(base.notes) patch.notes=[p.notes,base.notes].filter(Boolean).join("\n"); await pcol().doc(p.id).update(patch); p={...p,...patch}; ok(x,"Updated "+esc(org)); }
    else { const ref=await pcol().add({...base,tier:"🌱 Community & service orgs",stage:"Active partner",order:Math.max(0,...(S.partners||[]).map(q=>+q.order||0))+1,lastContact:now,createdAt:now,latest:"Becoming an enrollment designee",latestAt:now,history:[{at:now,text:"Added by the Designee Onboarding agent",changes:{}}]}); p={id:ref&&ref.id,...base,history:[]}; ok(x,"Created "+esc(org)); }
    x=step("Co-branded landing link (UTM) + QR");
    const slug=utmClean(d.project||""), src=utmClean(org.replace(/\(.*?\)/g,"")).replace(/[^a-z0-9_]/g,""), b=String(d.base||"").trim().replace(/\/+$/,"");
    if(b&&slug){ const camp="partner_outreach_"+slug, link=`${b}${b.includes("?")?"&":"?"}utm_source=${encodeURIComponent(src)}&utm_medium=community_partner&utm_campaign=${encodeURIComponent(camp)}&utm_content=${encodeURIComponent(initials(org).toUpperCase())}`;
      if(!(S.utm||[]).some(u=>u.link===link)) await ucol().add({base:b,src,med:"community_partner",camp,cont:initials(org).toUpperCase(),link,material:org+" enrollment link",where:"",date:new Date().toLocaleDateString("en-US"),by:"Sheree Taylor",approved:"",createdAt:now});
      if(p.id) await pcol().doc(p.id).update({utmLink:link,kit:{...(p.kit||{}),landing:true}}); p.utmLink=link; p.kit={...(p.kit||{}),landing:true};
      ok(x,`<code style="font-size:12px;word-break:break-all">${esc(link)}</code><br>Saved to your UTM log.`);
      x=step("Flyer in Canva: their name, number, link + QR"); const fu=await flyerCanva(p,null); if(fu){ p.kit={...(p.kit||{}),flyer:true}; ok(x,`<a href="${esc(fu)}" target="_blank" rel="noopener">Open the flyer in Canva ↗</a> — name, number and QR are theirs.`); } else { x.ok=true; x.d="Skipped — open the page in claude.ai with Canva + Google Drive allowed, then tap 📄 on their card."; ambOut(); } }
    else { x.ok=true; x.d="Skipped — add the project name and enrollment URL to make the link."; desOut(); }
    x=step("🎓 Training deck in Canva");
    if(S.mcp&&p.id){ try{ const dk={...(p.deck||{}),purpose:"training",link:p.utmLink||""}; await pcol().doc(p.id).update({deck:dk}); await deckCanva({...p,deck:dk},dk); const q=(S.partners||[]).find(z=>z.id===p.id); const url=(q&&q.deckUrl)||(S.dkMsg&&!S.dkMsg.err&&(S.dkMsg.html.match(/href="([^"]+)"/)||[])[1])||""; if(url){ p.deckUrl=url; ok(x,`<a href="${esc(url)}" target="_blank" rel="noopener">Open the training deck ↗</a>`); } else { x.ok=true; x.d="Canva didn't return a link — open the partner card › 📊 Pitch deck to retry."; desOut(); } }catch(e){ x.ok=true; x.d="Skipped: "+esc((e&&e.message)||"Canva not available") +". Make it from the partner card › 📊 Pitch deck › 🎓 Enrollment training."; desOut(); } }
    else { x.ok=true; x.d="Skipped — needs Canva connected in claude.ai. Make it from the partner card › 📊 Pitch deck."; desOut(); }

    else { x.ok=true; x.d="Skipped — open the page in claude.ai to draft it."; desOut(); }
    x=step("Badges in Canva for each enroller (name, org, Agent ID)");
    const names=String(d.enrollers||"").split(/\n|,|;/).map(z=>z.trim()).filter(Boolean); let made=0, added=0;

    const have=t=>S.tasks.some(q=>q.title===t.title); const list=[mk("enrollment + consumer protection training",d.training||dd(7),"Run the training with the 🎓 deck; CP Handbook"),mk("Designee Registration Form signed → Elena",dd(10),"Fillable PDF signed, then Company Info form + MES plan; log in the Designee Registration report"),mk("portal access for their enrollers",dd(10),"Set up logins after training",5),mk("badges made + shipped",dd(14),"One per enroller — Badges tab",4)].filter(t=>!have(t));
    for(const t of list) await col().doc().set(t); ok(x,list.length?list.length+" tasks added":"Tasks already existed");

function readTest(){ const g=k=>($("t_"+k)?.value||"").trim(); const checks=[...document.querySelectorAll("[data-tc]")].filter(c=>c.checked).map(c=>c.dataset.tc); const kind=(document.querySelector("[data-tk]:checked")||{}).value||"link"; return {name:g("name"),url:g("url"),kind,partnerId:g("partner"),checks,title:g("title"),contains:g("contains"),missing:g("missing")}; }
async function runTest(t){ if(!S.mcp){ toast("Open the page in claude.ai with Parallel Search allowed to run tests"); return; } S.tRunning[t.id]=true; renderList(); const t0=Date.now(); const details=[]; const add=(label,ok,note)=>details.push({label,ok:!!ok,note:note||""});
  try{ const res=mcpPayload(await S.mcp.callTool(WEB,"web_fetch",{urls:[t.url],full_content:true,objective:"Check this landing page loads and has a sign-up form",session_id:WEB_SID},{cache:false}));
    const r=(res.results||[])[0], err=(res.errors||[])[0]; const text=String((r&&(r.full_content||(r.excerpts||[]).join("\n")))||""), title=String((r&&r.title)||""), finalUrl=String((r&&r.url)||t.url);
    const C=t.checks||[];
    if(C.includes("loads")) add("Page loads",!!r&&text.length>200&&!/^\s*(404|page not found)/i.test(text),err?String(err.message||err):(text.length?text.length+" characters":"empty page"));
    if(t.kind==="designee"){ const p=(S.partners||[]).find(x=>x.id===t.partnerId); const nm=p&&(p.org||p.name); if(nm){ const words=nm.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>3); const hit=words.filter(x=>text.toLowerCase().includes(x)); add("Page is branded for "+nm,hit.length>0,hit.length?"found “"+hit[0]+"”":"partner name not on the page"); } add("No error text on the page",!/something went wrong|error occurred|invalid|not found/i.test(text),(text.match(/something went wrong|error occurred|not found/i)||[])[0]||"clean"); }
    if(C.includes("signup")) add("Sign-up / enroll form or button",/sign ?(me )?up|enroll|get started|join|subscribe|register/i.test(text),(text.match(/sign ?(me )?up|enroll|get started|join|subscribe|register/i)||[])[0]||"not found");
    if(C.includes("utm")){ const want=(t.url.match(/utm_[a-z]+=[^&]*/g)||[]); const kept=want.filter(k=>finalUrl.includes(k)); add("UTM tags survive",want.length?kept.length===want.length:false,want.length?`${kept.length}/${want.length} kept · landed on ${finalUrl.split("?")[0]}`:"no utm_ tags in this URL"); }
    if(C.includes("email")){ if(!t.signupAt) add("Confirmation email",false,"Sign up on the page with "+AM_INBOX+", then tap 📧 I signed up"); else { try{ const host=hostOf(finalUrl)||hostOf(t.url); const brand=host.split(".").slice(-2)[0]||"";
        const msgs=await amList({after:t.signupAt,limit:20}); const hit=msgs.find(m=>{ const f=String(m.from||"").toLowerCase(), sub=String(m.subject||"").toLowerCase(), pv=String(m.preview||"").toLowerCase(); return (brand&&(f.includes(brand)||sub.includes(brand)||pv.includes(brand)))||/confirm|verify|welcome|thank|enroll|sign/i.test(sub); })||msgs[0];
        if(!hit) add("Confirmation email",false,"nothing new in the inbox since "+fmtStamp(t.signupAt)+" — give it a few minutes and Run again");
        else { add("Confirmation email arrived",true,(hit.subject||"(no subject)")+" · from "+(hit.from||"?")); let body=""; try{ const full=mcpPayload(await S.mcp.callTool(AM,"get_message",{inboxId:AM_INBOX,messageId:hit.messageId||hit.id},{cache:false})); body=String((full&&(full.text||full.html))||""); }catch(_){ }
          if(body){ const links=(body.match(/https?:\/\/[^\s"'<>)]+/g)||[]); const back=links.filter(l=>brand&&l.toLowerCase().includes(brand)); add("Email links back to "+host,back.length>0,back.length?back[0].slice(0,90):(links.length+" links, none to "+host));
            if(C.includes("utm")){ const want=(t.url.match(/utm_[a-z]+=[^&]*/g)||[]); if(want.length){ const kept=want.filter(k=>body.includes(k)); add("UTM tags in the email",kept.length>0,kept.length+"/"+want.length+" found in the email links"); } } } } }
        catch(e){ add("Confirmation email",false,e&&(e.code==="not_in_manifest"||e.code==="not_granted")?"Allow AgentMail for this page (Permissions menu)":(e&&e.message)||"inbox not reachable"); } } }
    if(C.includes("title")&&t.title) add("Title contains “"+t.title+"”",title.toLowerCase().includes(t.title.toLowerCase()),"title: "+title);
    if(C.includes("contains")) String(t.contains||"").split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(x=>add("Contains “"+x+"”",text.toLowerCase().includes(x.toLowerCase())));
    if(C.includes("missing")) String(t.missing||"").split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(x=>add("Does not contain “"+x+"”",!text.toLowerCase().includes(x.toLowerCase())));
    const pass=details.every(d=>d.ok); const last={at:new Date().toISOString(),pass,ms:Date.now()-t0,title,finalUrl,details};
    await tcol().doc(t.id).update({last}); agLog((pass?"✅":"❌")+" Test "+(t.name||t.url)+": "+details.filter(d=>!d.ok).map(d=>d.label).join(", "),{act:"test",ref:t.id}); toast(pass?"✅ "+(t.name||"Test")+" passed":"❌ "+(t.name||"Test")+" failed — see what's wrong on the card");
  }catch(e){ const last={at:new Date().toISOString(),pass:false,ms:Date.now()-t0,details:[{label:"Could not fetch the page",ok:false,note:e&&(e.code==="not_in_manifest"||e.code==="not_granted")?"Allow Parallel Search for this page (Permissions menu)":(e&&e.message)||"no reply"}]}; try{ await tcol().doc(t.id).update({last}); }catch(_){ } toast("Test stopped — "+last.details[0].note); }
  finally{ delete S.tRunning[t.id]; renderList(); } }

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function dueOf(t){ if(!t.dueDate) return null; const [y,m,d]=t.dueDate.split("-").map(Number); const [h,mi]=(t.dueTime||"23:59").split(":").map(Number); return new Date(y,m-1,d,h,mi); }
function isLate(t){ if(t.status==="Complete") return false; const d=dueOf(t); if(!d) return false; if(!t.dueTime) return t.dueDate<ymd(new Date()); return d<new Date(); }
function endOf(range){
  const n=new Date(), e=new Date(n); e.setHours(23,59,59,999);
  if(range==="today") return e;
  if(range==="week"){ e.setDate(e.getDate()+((7-e.getDay())%7)); return e; }
  if(range==="month") return new Date(n.getFullYear(),n.getMonth()+1,0,23,59,59);
  const m={m2:2,m3:3,m6:6,year:12}[range]; if(m){ e.setMonth(e.getMonth()+m); return e; }
  return null;
}
function fmtDue(t){ const d=dueOf(t); if(!d) return ""; let s=d.toLocaleDateString(undefined,{month:"numeric",day:"numeric",year:"2-digit"}); if(t.dueTime) s+=" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); return s; }
const fmtShort=iso=>{ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"numeric",day:"numeric",year:"2-digit"}); };
const fmtStamp=iso=>{ const d=new Date(iso); return isNaN(d)?"":d.toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); };

function visible(){
  let ts=S.tasks.slice();
  const tq=(S.view==="list"?(S.tQ||""):"").trim().toLowerCase();
  if(tq){ const ws=tq.split(/\s+/); return ts.filter(t=>ws.every(w=>tText(t).includes(w))); }
  if(!S.showDone) ts=ts.filter(t=>t.status!=="Complete"||S.keepDone.has(t.id));
  if(S.filter==="late") ts=ts.filter(isLate);
  if(S.filter==="week"){ const e=endOf("week"); ts=ts.filter(t=>t.status!=="Complete"&&dueOf(t)&&dueOf(t)<=e); }
  if(S.filter==="waiting") ts=ts.filter(t=>t.status==="Waiting");
  if(S.filter==="prio") ts=ts.filter(t=>t.priority&&t.status!=="Complete");
  if(S.range!=="all"){
    if(S.range==="nodate") ts=ts.filter(t=>!t.dueDate);
    else { const e=endOf(S.range); ts=ts.filter(t=>dueOf(t)&&dueOf(t)<=e); }
  }
  return ts;
}
function sortT(a,b){
  const da=dueOf(a),db=dueOf(b);
  if((a.status==="Complete")!==(b.status==="Complete")) return a.status==="Complete"?1:-1;
  if(S.sortMode==="mine") return (a.order??0)-(b.order??0);
  if(!!a.goal!==!!b.goal) return a.goal?1:-1;
  if(!!a.priority!==!!b.priority) return a.priority?-1:1;
  if(da&&db&&da-db) return da-db; if(da&&!db) return -1; if(!da&&db) return 1;
  return (a.order||0)-(b.order||0);
}

function lastTouch(t){ const h=(t.history||[]).map(x=>x.at).filter(Boolean).sort(); return h.length?h[h.length-1]:(t.latestAt||t.assignedAt||""); }

function doNowList(){
  const open=S.tasks.filter(t=>t.status!=="Complete"&&!t.goal);
  const soon=new Date(); soon.setDate(soon.getDate()+3); soon.setHours(23,59,59);
  const score=t=>{ let s=0, why="";
    if(isLate(t)){ s+=100; why="Overdue"; }
    if(t.priority){ s+=60; why=why||"High priority"; }
    if(needsNudge(t)){ s+=50; why=why||`No reply ${quietDays(t)} days`; }
    const d=dueOf(t); if(d&&d<=soon&&!isLate(t)){ s+=40; why=why||"Due soon"; }
    if(d) s+=Math.max(0,30-Math.floor((d-Date.now())/864e5));

}

function applyPatch(t,patch,text){
  const changes={}; const out={};
  for(const [k,v] of Object.entries(patch)){
    if(v===undefined||v===null) continue;
    const nv=k==="cat"?+v:String(v);
    const ov=k==="cat"?+t[k]:String(t[k]??"");
    if(nv!==ov){ changes[k]=[k==="cat"?CATS[ov]?.name:ov, k==="cat"?CATS[nv]?.name:nv]; out[k]=nv; }
  }
  const now=new Date().toISOString();
  if(out.status==="Complete") out.doneAt=now;
  if(out.status && out.status!=="Complete" && t.status==="Complete") out.doneAt=null;
  if(!text && !Object.keys(changes).length) return null;
  const hist=[...(t.history||[]),{at:now,text:text||"Edited",changes}];
  out.history=hist.slice(-60);
  if(text){ out.latest=text; out.latestAt=now; }
  return out;
}

}

// ---- Pitch deck: fill "IL Partnership Pitch Deck - TEMPLATE.pptx" ({{Tokens}}) with a partner's Budget + MSA numbers
async function fillDeck(JSZip, bytes, vals, hideFacility){
  const zip=await JSZip.loadAsync(bytes);
  const xe=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
  for(const n of names){ let x=await zip.file(n).async("string"); if(!x.includes("{{")) continue;
    if(hideFacility&&x.includes("{{Facility Annual Savings}}")) x=x.replace(/<p:sld(\s)/,'<p:sld show="0"$1');
    x=x.replace(/\{\{([^}]+)\}\}/g,(m,k)=>xe(vals[k]==null?"[____]":vals[k])); zip.file(n,x); }
  return await zip.generateAsync({type:"uint8array",mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation",compression:"DEFLATE"});
}
const usd=v=>"$"+Math.round(+v||0).toLocaleString("en-US");
const numIn=v=>+String(v??"").replace(/[^\d.]/g,"")||0;
function deckValues(p,d){
  const m=p.msa||{}, b=p.budget||{}, has=k=>m["$"+k]!=null||b[k]!=null, g=k=>m["$"+k]!=null?+m["$"+k]:+(b[k]||0);
  const N=numIn(m.subs)||+b.N||0, pay={G:g("G"),F1:g("F1"),T1:g("T1")||100,F2:g("F2"),B1:g("B1"),TB1:g("TB1"),B2:g("B2"),TB2:g("TB2"),wage:g("wage"),hours:g("hours"),weeks:g("weeks")};
  const staff=pay.wage*pay.hours*pay.weeks;
  const total=pay.G+pay.F1*Math.min(N,pay.T1)+pay.F2*Math.max(N-pay.T1,0)+(N>=pay.TB1?pay.B1:0)+(N>=pay.TB2?pay.B2:0)+staff;
  const org=(d.name||String(p.org||"").replace(/\s*\(.*?\)\s*/g," ").trim()||m.cap||p.name||"").trim(), sub=numIn(d.subSave)||250, fa=numIn(d.fAnnual);
  const f25=numIn(d.f25)||(fa?Math.round(fa*36.459/1000)*1000:0);   // 25 years with a 3% credit-rate escalator
  const life=N*sub*25;

    "Partner Name":org, "Date":d.date||new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}),
    "Project Name":m.project||b.project||d.project||"[project]", "Project Address":d.addr||"",
    "Target Enrollments":N?N.toLocaleString("en-US"):"", "Upfront Grant":usd(pay.G), "Upfront After":String(numIn(m.$UA)||10),
    "Per Enrollment Fee":usd(pay.F1), "Tier 1 Count":String(pay.T1), "Step-Up Fee":usd(pay.F2),
    "Milestone 1 Payment":usd(pay.B1), "Milestone 1 Count":String(pay.TB1), "Milestone 2 Payment":usd(pay.B2), "Milestone 2 Count":String(pay.TB2),
    "Staff Wages":staff?usd(staff):"staff support", "Total Funding":usd(total),

    "Facility Annual Savings":fa?usd(fa):"", "Facility 25-Year Savings":f25?usd(f25):"", "Savings Start":d.start||"[quarter]", "Savings Basis":d.basis||"its recent utility bills",

async function crmAct(act,a,p,card){
  if(act==="kit"){ const on=!p.needsKit; await pWrite(p.id,{needsKit:on,history:pHist(p,on?"Flagged for a partner kit (Budget → MSA → Slide)":"Kit flag removed")},on?"🧰 Kit started: Budget first":"Kit flag removed"); return true; }
  if(act==="kittype"){ const v=a.dataset.v; if(v===kitType(p)) return true; await pWrite(p.id,{kitType:v,history:pHist(p,"Kit type: "+KITS[v].name)},KITS[v].ic+" "+KITS[v].name); return true; }
  if(act==="kittick"){ await kitTick(p,a.dataset.v); return true; }
  if(act==="kitact"){ await kitAct(p,a.dataset.v,card); return true; }
  if(act==="ssmenu"){ S.pSSMenu=S.pSSMenu===p.id?null:p.id; renderList(); return true; }
  if(act==="ssset"){ const v=a.dataset.v, old=p.ssStatus||""; if(v===old){ S.pSSMenu=null; renderList(); return true; }
    S.pSSMenu=null; S.pJust=p.id; setTimeout(()=>{ if(S.pJust===p.id) S.pJust=null; },900);
    await pWrite(p.id,{ssStatus:v,history:pHist(p,`Partner status: ${old||"none"} → ${v}`,{ssStatus:[old,v]})},v===SS[5]?"🎉 Signed! Nice work":`➜ Moved to ${v}`); return true; }
  if(act==="pricycle"||act==="priset"){ const cur=priOf(p), v=act==="priset"?a.dataset.v:(cur==="1"?"2":cur==="2"?"3":"1"); if(v===cur) return true;
    await pWrite(p.id,{priority:+v,history:pHist(p,`Priority: ${cur?"P"+cur:"none"} → P${v}`,{priority:[cur,v]})},`★ Priority ${v}`); return true; }
  if(act==="nextsave"){ const v=(card.querySelector("[data-pnext]")?.value||"").trim(); if(v===(p.nextStep||"")) { toast("No change"); return true; }
    await pWrite(p.id,{nextStep:v,history:pHist(p,"Next step: "+(v||"(cleared)"),{nextStep:[p.nextStep||"",v]})},"💾 Next step saved"); return true; }
  if(act==="mktask"){ const v=(card.querySelector("[data-pnext]")?.value||p.nextStep||"").trim(); if(!v){ toast("Type a next step first"); return true; }
    const now=new Date().toISOString(), org=p.org||p.name;
    try{ await col().doc().set({cat:1,title:`${org} — ${v}`,status:"Not Started",who:p.name&&p.name!==p.org?p.name:"",dueDate:"",dueTime:"",nextStep:v,doneWhen:"",notes:"",priority:false,latest:"Added from partner card",latestAt:now,assignedAt:now,order:Math.max(0,...S.tasks.map(x=>+x.order||0))+10,history:[{at:now,text:"Added from the "+org+" partner card",changes:{}}]});
      if(v!==(p.nextStep||"")) await pcol().doc(p.id).update({nextStep:v,history:pHist(p,"Next step: "+v+" (added to Tasks)")});
      toast("➕ Added to your Tasks"); }catch(err){ writeErr(err); } return true; }
  if(act==="smartlog"){ const inp=card.querySelector("[data-pupd]"); const txt=(inp?.value||"").trim(); if(!txt){ inp?.focus(); return true; } if(!S.sample){ toast("Open in claude.ai for smart updates — logged as a note"); a.previousElementSibling?.click(); return true; }
    a.disabled=true; a.textContent="🪄…"; try{ const res=await S.sample.json(promptFor(`About ${p.name||""}${p.org&&p.org!==p.name?" ("+p.org+")":""} (partner id p:${p.id}): ${txt}`),{modelTier:"default",cache:false}); await applyAI(res||{},txt); inp.value=""; }catch(err){ toast("Couldn't update — logged as a note instead"); try{ await pWrite(p.id,{latest:txt,latestAt:new Date().toISOString(),history:pHist(p,txt)}); inp.value=""; }catch(_){ } } finally{ a.disabled=false; a.textContent="✨ Update"; } return true; }
  if(act==="kitopen"){ S.pOpen=p.id; S.pEdit=null; renderList(); requestAnimationFrame(()=>{ const el=document.querySelector(`.pcard[data-pid="${CSS.escape(p.id)}"] .kitbar`); el&&el.scrollIntoView({behavior:"smooth",block:"start"}); }); return true; }
  if(act==="logtype"){ S.pLogType=a.dataset.v; card.querySelectorAll('[data-pact="logtype"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.pLogType)); card.querySelector("[data-pupd]")?.focus(); return true; }
  if(act==="log"){ const inp=card.querySelector("[data-pupd]"); const txt=(inp?.value||"").trim(); if(!txt){ inp?.focus(); return true; }
    const t=LOGT.find(x=>x[0]===S.pLogType)||LOGT[0]; const now=new Date().toISOString(); const text=(t[0]==="note"?"":`${t[1]} ${t[2]}: `)+txt;
    const patch={latest:txt,latestAt:now,history:pHist(p,text)}; if(t[3]) patch.lastContact=now; inp.value="";
    await pWrite(p.id,patch,t[3]?`${t[1]} ${t[2]} logged`:"📝 Note saved"); return true; }
  if(act==="draftsave"){ const subj=(card.querySelector("[data-psubj]")?.value||"").trim(), body=card.querySelector("[data-pbody]")?.value||"";
    if(subj===(p.subject||"")&&body===(p.body||"")){ toast("No changes"); return true; }
    await pWrite(p.id,{subject:subj,body,history:pHist(p,"Email draft updated")},"💾 Draft saved"); return true; }
  if(act==="copy"){ const subj=(card.querySelector("[data-psubj]")?.value??p.subject??""), body=(card.querySelector("[data-pbody]")?.value??p.body??"");
    const ok=await copyText((subj?`Subject: ${subj}\n\n`:"")+body); toast(ok?"📋 Email copied":"Press and hold the email text to copy it"); return true; }
  if(act==="tlall"){ S.pTlAll=S.pTlAll===p.id?null:p.id; renderList(); return true; }
  if(act==="slides"){ S.slName=p.org||p.name; S.view="slides"; render(); window.scrollTo&&window.scrollTo(0,0); toast("📊 Partner name filled in — pick a template"); return true; }
  return false;
}

function partnersHTML(){
  if(!S.pLoaded) return `<div class="empty">Loading partners…</div>`;
  const amb=S.pKind==="amb";
  const q=(S.pQ||"").trim().toLowerCase();
  let ps=q?S.partners.slice():pKindList();
  if(q){ ps=ps.filter(p=>pMatch(p,q)); }
  else if(S.pStage==="stale") ps=ps.filter(p=>p.stage==="Emailed"&&daysSince(p.lastContact)>=7);
  else if(S.pStage==="kit") ps=ps.filter(p=>p.needsKit&&kitLeft(p)>0);
  else if(S.pStage!=="all") ps=ps.filter(p=>p.stage===S.pStage);
  if(!q&&!amb&&S.pSS!=="all") ps=ps.filter(p=>(p.ssStatus||"")===S.pSS);
  ps.sort((a,b)=>String(a.org||a.name||"").localeCompare(String(b.org||b.name||""),undefined,{sensitivity:"base"}));
  const add=S.pAdding?`<div class="addcard"><h3 style="margin:0 0 8px">${amb?"➕ New ambassador":"➕ New partner"}</h3>${pFormHTML(amb?{tier:TIERS[6],stage:"Active partner",role:"Community Ambassador",needsKit:true,kitType:"ambassador"}:{tier:TIERS[6],stage:"To email"},true)}${amb?`<div class="pnote" style="margin-top:8px">Faster: Tools › 🦋 Ambassador Onboarding makes their card, link, flyer, welcome email and tasks in one go.</div>`:""}</div>`:"";
  if(!ps.length) return add+(q?`<div class="empty">No one matches “${esc(S.pQ)}”. Try part of the name.</div>`:amb?`<div class="empty">No ambassadors yet. Tap ➕ Add ambassador, or run Tools › 🦋 Ambassador Onboarding.</div>`:`<div class="empty">No partners here yet. Tap ➕ Add partner to add one.</div>`);
  const qnote=q?`<div class="muted" style="margin:4px 0 10px;font-size:14px">${ps.length} match${ps.length===1?"":"es"} for “${esc(S.pQ)}” across all stages · press Enter to open the first one</div>`:"";
  const AG=["🧰 Getting set up","💗 All set"];
  const gk=p=>(amb&&!q)?(p.needsKit&&kitLeft(p)>0?AG[0]:AG[1]):(p.ssStatus||"");
  const groups=(amb&&!q)?AG.filter(g=>ps.some(p=>gk(p)===g)):[...new Set(ps.slice().sort(ssSort).map(gk))];
  return add+qnote+(groups.length>1?`<div class="pgall"><button class="linkbtn" data-pgall="close">▸ Collapse all</button><button class="linkbtn" data-pgall="open">▾ Expand all</button></div>`:"")+groups.map(v=>{ const t=v||"No partner status yet", key=v||"_none"; const items=ps.filter(p=>gk(p)===v).sort((amb&&!q)?((a,b)=>String(a.name||a.org||"").localeCompare(String(b.name||b.org||""),undefined,{sensitivity:"base"})):ssSort); const closed=!q&&S.pgClosed.has(key)&&!items.some(p=>p.id===S.pOpen);
    return items.length?`<section class="pgroup${closed?" pclosed":""}"><h2><button class="pgtog" data-pgtog="${esc(key)}" aria-expanded="${!closed}"><span class="pgcar" aria-hidden="true">▾</span>${esc(t)} <span class="muted" style="font-size:14px;font-weight:400">${items.length}</span></button></h2>${closed?"":items.map(pCardHTML).join("")}</section>`:""; }).join("");
}

  const a=e.target.closest("[data-pgall]"); if(a){ if(a.dataset.pgall==="open") S.pgClosed.clear(); else { ["_none",...SS,"🧰 Getting set up","💗 All set"].forEach(k=>S.pgClosed.add(k)); S.pOpen=null; } pgSave(); renderList(); } });
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch{} ta.remove(); return ok; }
}
function readPForm(root){ const o={}; root.querySelectorAll("[data-pf]").forEach(el=>o[el.dataset.pf]=el.value.trim()); if("kitType" in o){ o.needsKit=!!o.kitType; if(!o.kitType) delete o.kitType; } return o; }
async function pWrite(id,patch,msg){ try{ await pcol().doc(id).update(patch); if(msg) toast(msg); }catch(err){ writeErr(err); } }
function pHist(p,text,changes={}){ return [...(p.history||[]),{at:new Date().toISOString(),text,changes}].slice(-60); }
$("list").addEventListener("click",async e=>{
  const a=e.target.closest("[data-pact]"); if(!a||S.view!=="partners") return;
  const act=a.dataset.pact; S.svPg=a.dataset.v||null;
  if(act==="stage") return;
  if(act==="create"){
    const f=readPForm(a.closest(".pform")); if(!f.name){ toast("Add a name first"); return; }
    const now=new Date().toISOString();
    try{ await pcol().add({...f,order:Math.max(0,...S.partners.map(x=>+x.order||0))+1,lastContact:"",createdAt:now,history:[{at:now,text:"Added",changes:{}}]}); S.pAdding=false; toast("🤝 Partner added"); }catch(err){ writeErr(err); }
    return;
  }
  if(act==="cancel"){ S.pAdding=false; S.pEdit=null; renderList(); return; }
  const card=a.closest(".pcard"); if(!card) return;
  const p=S.partners.find(x=>x.id===card.dataset.pid); if(!p) return;
  if(act==="budget"||act==="msa"||act==="abp"||act==="deck"||act==="savings"){ S.pPanel=(S.pPanel&&S.pPanel.id===p.id&&S.pPanel.kind===act)?null:{id:p.id,kind:act}; renderList();
    if(S.pPanel){ requestAnimationFrame(()=>{ const c=[...document.querySelectorAll("#list .pcard")].find(x=>x.dataset.pid===p.id), el=c&&c.querySelector(`.ppanel[data-panel="${act}"]`);
      if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("pflash"); setTimeout(()=>el.classList.remove("pflash"),1200); } }); }
    return; }
  if(await deckAct(act,p,card)) return;
  if(await crmAct(act,a,p,card)) return;
  if(await panelAct(act,p,card)) return;
  if(act==="toggle"){ S.pOpen=S.pOpen===p.id?null:p.id; S.pEdit=null; S.pPanel=null; S.pSSMenu=null; renderList(); return; }
  if(act==="edit"){ S.pEdit=p.id; renderList(); return; }
  if(act==="save"){ const f=readPForm(a.closest(".pform")); if(!f.name) f.name=p.name; await pWrite(p.id,{...f,history:pHist(p,"Edited")},"💾 Saved"); S.pEdit=null; return; }
  if(act==="copy"){ const ok=await copyText((p.subject?`Subject: ${p.subject}\n\n`:"")+(p.body||"")); toast(ok?"📋 Email copied":"Couldn't copy. Press and hold the email text to copy it."); return; }
  if(act==="draft"){ S.aiCtx={kind:"followup",pid:p.id,to:p.email||"",name:p.name||p.org}; askClaude("✍️ Follow-up to "+(p.name||p.org),partnerPrompt(p)); return; }
  if(act==="mailopen"){ if(p.stage==="To email") setTimeout(()=>toast("Sent it? Tap 📨 Mark emailed"),800); return; }
  if(act==="sent"){ const now=new Date().toISOString(); await pWrite(p.id,{stage:"Emailed",lastContact:now,history:pHist(p,"Emailed",{stage:[p.stage,"Emailed"]})},"📨 Marked emailed"); return; }
  if(act==="log"){ const inp=card.querySelector("[data-pupd]"); const txt=inp.value.trim(); if(!txt) return; inp.value=""; const now=new Date().toISOString(); await pWrite(p.id,{latest:txt,lastContact:now,history:pHist(p,txt)},"Update saved"); return; }
  if(act==="del"){
    if(!a.classList.contains("armed")){ a.classList.add("armed"); a.textContent="Delete?"; toast("Tap Delete? again to remove this partner"); setTimeout(()=>{ if(a.isConnected){ a.classList.remove("armed"); a.textContent="🗑️ Delete"; } },4000); return; }
    try{ await pcol().doc(p.id).delete(); S.pOpen=null; toast("🗑️ Deleted"); }catch(err){ writeErr(err); }
  }
});

// ---- CP check-in view
// Agenda = tasks flagged cpAgenda. Grouped by what CP is being asked to do, not by work area.
// Meeting records live in data/users/<uid>/meetings/items — the same shape a future Teams-transcript agent will write.
const CPT=[["decide","🔴 Decision needed","CP makes a call"],["review","👀 Review / approve","CP signs off or gives feedback"],["plan","🧭 Plan together","Work it out live"],["fyi","📣 FYI","30 seconds, no input needed"]];
const mcol=()=>S.db.doc("data/users/"+S.uid+"/meetings").collection("items");
S.meetings=[]; S.mOpenId=null;
function cpItems(){ return S.tasks.filter(t=>t.cpAgenda&&t.status!=="Complete"&&!t.goal); }
function cpWaiting(){ return S.tasks.filter(t=>t.owner==="CP"&&t.status!=="Complete"&&!t.goal); }
function nextCheckin(){ const d=new Date(); for(let i=0;i<8;i++){ const x=new Date(d); x.setDate(d.getDate()+i); const w=x.getDay(); if((w===2&&(i>0||d.getHours()<10))||(w===4&&(i>0||d.getHours()<15))) return x.toLocaleDateString(undefined,{weekday:"short",month:"numeric",day:"numeric"})+(w===2?" · 9:30 CT":" · 2:00 CT"); } return ""; }
const cpSort=(a,b)=>String(a.dueDate||"9999").localeCompare(String(b.dueDate||"9999"))||sortT(a,b);
function dueChip(t){ return t.dueDate?`<span class="chip${isLate(t)?" late":""}">${isLate(t)?"Overdue ":"Due "}${esc(fmtDue(t))}</span>`:""; }
function cpHTML(){
  const items=cpItems(), wait=cpWaiting(), noAsk=items.filter(t=>!t.cpAsk||!t.cpType).length;
  const mins=items.reduce((m,t)=>m+(t.cpType==="fyi"?1:t.cpType==="plan"?10:5),0);
  let n=0;
  const bar=`<div class="cpbar"><div class="grow"><h2>🗣️ Check-in with Charlotte</h2><div class="sub">${nextCheckin()?"Next: "+esc(nextCheckin())+" · ":""}${items.length} item${items.length===1?"":"s"} · about ${mins} min</div></div>
    ${items.length?`<button class="pbtn main" data-cpcopy="1">📋 Copy agenda for Teams</button>`:""}</div>`;
  const prep=noAsk?`<div class="cpprep">✏️ ${noAsk} item${noAsk===1?" needs":"s need"} an ask before the call — pick a type and write one line on what you need from her.</div>`:"";
  const untyped=items.filter(t=>!t.cpType);
  const groups=[...CPT,["","✏️ Not sorted yet","Pick a type"]].map(([id,label,hint])=>{
    const its=(id?items.filter(t=>t.cpType===id):untyped).sort(cpSort); if(!its.length) return "";
    return `<section class="cpsec"><h3>${label} <span class="n">${its.length}</span><span class="hint2">${hint}</span></h3>${its.map(t=>{ n++; const c=CATS[t.cat]||CATS[1];
      return `<div class="cpitem" style="--c:${c.head}">
        <div class="cptop"><span class="cpnum">${n}.</span><span class="cpt" data-goto="${esc(t.id)}" role="button" tabindex="0">${esc(t.title)}</span>${dueChip(t)}<span class="chip">${stIcon(t.status)} ${esc(t.status)}</span></div>
        <div class="cpaskline"><label for="cpa-${esc(t.id)}">Ask</label><input id="cpa-${esc(t.id)}" class="${t.cpAsk?"":"need"}" data-cpask="${esc(t.id)}" value="${esc(t.cpAsk||"")}" placeholder="One line: what do you need from Charlotte?"></div>
        <div class="types" role="group" aria-label="Type of ask">${CPT.map(([tid,tl])=>`<button data-cptype="${tid}" data-id="${esc(t.id)}" aria-pressed="${t.cpType===tid}">${tl}</button>`).join("")}</div>
        ${t.latest?`<div class="cpctx">Where it stands: ${esc(t.latest)}</div>`:""}
        <div class="cpdone"><input data-cpout="${esc(t.id)}" placeholder="During the call: what did she decide or say?" aria-label="Outcome for ${esc(t.title)}"><button class="pbtn" data-cpdisc="${esc(t.id)}">✓ Discussed</button></div>
      </div>`; }).join("")}</section>`; }).join("");
  const empty=items.length?"":`<section class="cpsec"><div class="cpempty">Nothing on the agenda yet. Monday: update the tracker, then open each task that needs Charlotte and tap <b>🗣️ Add to CP agenda</b>.</div></section>`;
  const waitHTML=`<section class="cpsec"><h3>⏳ Waiting on Charlotte <span class="n">${wait.length}</span><span class="hint2">Her to-dos — check in on these</span></h3>${wait.length?wait.sort(cpSort).map(t=>`<div class="cpwait"><span class="cpt" data-goto="${esc(t.id)}" role="button" tabindex="0">${esc(t.title)}</span>${dueChip(t)}</div>`).join(""):`<div class="cpempty">Nothing waiting on her.</div>`}</section>`;
  const ms=S.meetings.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);
  const li=a=>(a||[]).length?`<ul>${a.map(x=>`<li>${typeof x==="string"?esc(x):esc(x.text)+(x.due?` <span class="chip">Due ${esc(x.due)}</span>`:"")}</li>`).join("")}</ul>`:`<div class="cpctx">None</div>`;
  const recs=`<section class="cpsec"><h3>🗒️ Past check-ins <span class="n">${S.meetings.length}</span></h3>${ms.length?ms.map((m,i)=>`<details class="mrec"${i===0?" open":""}><summary>${esc(m.title||"Check-in")} <span class="sub">· ${esc(m.date)}${m.source?" · "+esc(m.source):""}</span></summary><div class="mbody">
      ${m.decisions?.length?`<div><h4>Decisions</h4>${li(m.decisions)}</div>`:""}
      <div><h4>My action items</h4>${li(m.actionsMe)}</div>
      <div><h4>Charlotte's action items</h4>${li(m.actionsCP)}</div>
      ${m.discussed?.length?`<div><h4>Discussed</h4>${li(m.discussed.map(d=>d.title+(d.outcome?" — "+d.outcome:"")))}</div>`:""}
      ${m.open?.length?`<div><h4>Open questions</h4>${li(m.open)}</div>`:""}
      ${m.gaps?`<div class="mgap">⚠️ ${esc(m.gaps)}</div>`:""}
    </div></details>`).join(""):`<div class="cpempty">Notes from each check-in land here.</div>`}</section>`;
  return `<div class="cpwrap">${bar}${prep}${groups}${empty}${waitHTML}${recs}</div>`;
}
function cpAgendaText(){
  const items=cpItems(); let n=0; const L=["Check-in agenda"+(nextCheckin()?" — "+nextCheckin():""),""];
  for(const [id,label] of [...CPT,["","Other"]]){ const its=(id?items.filter(t=>t.cpType===id):items.filter(t=>!t.cpType)).sort(cpSort); if(!its.length) continue;
    L.push(label.replace(/^\S+\s/,"").toUpperCase()); its.forEach(t=>{ n++; L.push(`${n}. ${t.title}${t.dueDate?" (due "+fmtDue(t)+")":""}`); if(t.cpAsk) L.push("   → "+t.cpAsk); }); L.push(""); }
  const w=cpWaiting(); if(w.length){ L.push("ON YOUR LIST"); w.forEach(t=>L.push("• "+t.title)); }
  return L.join("\n").trim();
}
async function cpUpdate(t,patch,text){ const now=new Date().toISOString(); const ch={}; for(const k in patch) ch[k]=[String(t[k]??""),String(patch[k]??"")];
  const hist=[...(t.history||[]),{at:now,text,changes:ch}].slice(-60); await col().doc(t.id).update({...patch,history:hist}); }
$("list").addEventListener("change",async e=>{ const id=e.target.dataset?.cpask; if(!id||!S.db) return; const t=S.tasks.find(x=>x.id===id); if(!t) return;
  const v=e.target.value.trim(); if(v===(t.cpAsk||"")) return;
  try{ await cpUpdate(t,{cpAsk:v},"Ask for CP: "+(v||"(cleared)")); toast("💾 Saved"); }catch(err){ writeErr(err); } });
$("list").addEventListener("click",async e=>{
  if(S.view!=="cp") return;
  if(e.target.closest("[data-cpcopy]")){ const txt=cpAgendaText();
    try{ await navigator.clipboard.writeText(txt); toast("📋 Copied — paste it in the Teams chat"); }catch(_){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("📋 Copied"); }catch(__){ toast("Couldn't copy. Select the text and copy it."); } ta.remove(); } return; }
  const ty=e.target.closest("[data-cptype]"); if(ty){ const t=S.tasks.find(x=>x.id===ty.dataset.id); if(!t) return; const v=t.cpType===ty.dataset.cptype?"":ty.dataset.cptype;
    try{ await cpUpdate(t,{cpType:v},"CP ask type: "+(v||"(cleared)")); }catch(err){ writeErr(err); } return; }
  const dz=e.target.closest("[data-cpdisc]"); if(dz){ const t=S.tasks.find(x=>x.id===dz.dataset.cpdisc); if(!t) return;
    const out=(document.querySelector(`[data-cpout="${CSS.escape(t.id)}"]`)?.value||"").trim(); const day=ymd(new Date());
    try{
      await cpUpdate(t,{cpAgenda:false,cpAsk:"",cpType:"",latest:out?"CP: "+out:t.latest||"",latestAt:new Date().toISOString()},"Discussed with CP"+(out?": "+out:""));
      const ref=mcol().doc(day); const ex=S.meetings.find(m=>m.id===day);
      const disc=[...((ex&&ex.discussed)||[]),{taskId:t.id,title:t.title,outcome:out}];
      if(ex) await ref.update({discussed:disc}); else await ref.set({date:day,title:"CP check-in",source:"Logged live",decisions:[],actionsMe:[],actionsCP:[],open:[],discussed:disc,createdAt:new Date().toISOString()});
      toast("✓ Logged to today's check-in");
    }catch(err){ writeErr(err); } return; }
});
function bootMeetings(){ if(!S.db||!S.uid||S.mBooted) return; S.mBooted=true; mcol().onSnapshot(snap=>{ S.meetings=snap.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.date); if(S.view==="cp") renderList(); },()=>{}); }
setInterval(bootMeetings,500);



// Rebuilds "C&C Campaign Cost Calculator_7.13.xlsx" with a partner's variables filled in.
// Shared by the Workstream page (window.ExcelJS) and the node test.
function buildBudgetWorkbook(ExcelJS, v){
  const wb=new ExcelJS.Workbook();
  const T=wb.addWorksheet("Tab 1"), A=wb.addWorksheet("Breakeven Analysis"), N=wb.addWorksheet("Notes");
  const USD0='"$"#,##0', USD3='"$"0.000', USD2='"$"0.00';
  const put=(ws,addr,val,fmt,bold)=>{ const c=ws.getCell(addr); c.value=val; if(fmt) c.numFmt=fmt; if(bold) c.font={bold:true}; return c; };
  const f=x=>({formula:x});
  const fmtD=iso=>{ const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
  const addDays=(iso,n)=>{ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  const len=Math.max(1,+v.weeks||12)*7, Nn=Math.max(1,+v.N||1);
  const when=n=>v.start?fmtD(addDays(v.start,Math.round(len*Math.min(1,n/Nn)))):"";

  T.columns=[{width:3},{width:52},{width:14},{width:40},{width:26},{width:6}];
  put(T,"B1",`${v.name} — C&C Campaign Budget`,null,true).font={bold:true,size:14};
  put(T,"B2","Market Rate Assumptions - $/kWh [Adjust based on market]",null,true); put(T,"E2","Legend",null,true);
  put(T,"B3","Avg Customer Usage STATE (kWh) (As of 2/6/26)"); put(T,"C3",+v.U||7500,"#,##0"); put(T,"E3","market-specific input");
  put(T,"B4","Ampion aquistition costs"); put(T,"C4",f("0.08"),USD3); put(T,"E4","partner-specific input");
  put(T,"B5","70% Ampion costs"); put(T,"C5",f("C4*0.7"),USD3);
  put(T,"B6","Ampion assist cost (5% of enrollment cases)"); put(T,"C6",0.02,USD3);
  put(T,"B7","Ampion onboarding cost (95% of enrollment cases"); put(T,"C7",0.01,USD3);
  put(T,"B8","Target all-in C&C partner cost"); put(T,"C8",f("C5-((0.95*C7)+(0.05*C6))"),USD3);
  put(T,"B9","Gift Card "); put(T,"C9",f("50/C3"),USD3); put(T,"D9","$/customer");
  put(T,"B10","Target C&C partner direct cost"); put(T,"C10",f("C5-((0.95*C7)+(0.05*C6))-C9"),USD3); put(T,"D10",f("C10*C3"),'"$"#,##0.000');
  put(T,"B11","100% Ampion partner direct cost"); put(T,"C11",f("C4+C9"),USD3); put(T,"D11",f("C11*C3"),USD2);
  put(T,"B13","C&C Partner Campaign Variables - Adjust based on market",null,true); put(T,"D13","Notes",null,true);
  const rows=[[14,"Projected Customers Aquired through Channel ",+v.N,"#,##0"],[15,"Upfront Grant ",+v.G,USD0],[16,"Per-subscriber fee",+v.F1,USD0],[17,"Per-subscriber step-up",+v.F2,USD0],[18,"After X subscribers",+v.T1,"#,##0"],[19,"Bonus 1",+v.B1,USD0],[20,"After X subscribers",+v.TB1,"#,##0"],[21,"Bonus 2",+v.B2,USD0],[22,"After X subscribers",+v.TB2,"#,##0"]];
  rows.forEach(([r,l,val,fm])=>{ put(T,"B"+r,l); const c=put(T,"C"+r,val,fm); c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF2CC"}}; });
  put(T,"D14",`${Math.round(Nn/Math.max(1,+v.weeks||12)*4.33)}/month pace${v.project?" · Project: "+v.project:""}`);
  put(T,"D18",`Milestone 1: ${v.T1} customers${when(+v.T1)?" by "+when(+v.T1):""}`);
  put(T,"D20",`Milestone 2: ${v.TB1} customers${when(+v.TB1)?" by "+when(+v.TB1):""}`);
  put(T,"D22",`Milestone 3: ${v.TB2} customers${when(+v.TB2)?" by "+when(+v.TB2):""}`);
  put(T,"B23","Staff salary"); put(T,"C23",f("PRODUCT(C24,C25,C26)"),USD0);
  [[24,"Wage",+v.wage,USD2],[25,"Weeks",+v.weeks,"0"],[26,"# of hours per week",+v.hours,"0"]].forEach(([r,l,val,fm])=>{ put(T,"B"+r,l); const c=put(T,"C"+r,val,fm); c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF2CC"}}; });
  if(v.start) put(T,"D25",`extend based on meeting goal^ · starts ${fmtD(v.start)}`); else put(T,"D25","extend based on meeting goal^");
  put(T,"B28","Calculations",null,true); put(T,"C28",f("C15+C16*MIN(C14,C18)+C17*MAX(C14-C18,0)+IF(C14>=C20,C19,0)+IF(C14>=C22,C21,0)+C23"),USD0,true);
  put(T,"B29","CAC at target enrollments ($/customer)"); put(T,"C29",f("C28/C14"),USD0);
  put(T,"B30","CAC at target enrollments ($/kWh)"); put(T,"C30",f("C28/(C3*C14)"),USD3);
  put(T,"B33","Practical Breakeven Calculator",null,true);
  put(T,"B35","Enter target $/kWh:"); put(T,"C35",+v.target||0.056,USD3);
  put(T,"B37","Calculated Breakeven (iterative check):",null,true);
  const BA="'Breakeven Analysis'!";
  put(T,"B38","Tier 1 estimate (if no step-up/bonuses):"); put(T,"C38",f(`(${BA}$C$4+${BA}$C$5)/($C$35*${BA}$C$13-${BA}$C$6)`),"0");
  put(T,"B39","Is this valid (≤ Tier 1 threshold)?"); put(T,"C39",f(`IF(C38<=${BA}$C$7,"YES - use this","NO - check Tier 2")`));
  put(T,"B41","Tier 2 estimate:"); put(T,"C41",f(`(${BA}$C$4+${BA}$C$5+${BA}$C$7*(${BA}$C$8-${BA}$C$6))/($C$35*${BA}$C$13-${BA}$C$8)`),"0");
  put(T,"B42","Includes Bonus 1?"); put(T,"C42",f(`IF(C41>=${BA}$C$10,"YES","NO")`));
  put(T,"B43","Includes Bonus 2?"); put(T,"C43",f(`IF(C41>=${BA}$C$12,"YES","NO")`));
  put(T,"B45","Final Breakeven Customers:",null,true); put(T,"C45",f(`IF(C38<=${BA}$C$7,C38,C41)`),"0",true);
  put(T,"B46","Verification - Cost/kWh at breakeven:"); put(T,"C46",f(`(${BA}$C$4+${BA}$C$5+(MIN(C45,${BA}$C$7)*${BA}$C$6)+(MAX(0,C45-${BA}$C$7)*${BA}$C$8)+IF(C45>=${BA}$C$10,${BA}$C$9,0)+IF(C45>=${BA}$C$12,${BA}$C$11,0))/(C45*${BA}$C$13)`),USD3);

  A.columns=[{width:16},{width:24},{width:14},{width:22},{width:22}];
  put(A,"A1","Breakeven Analysis - Cost Per kWh at Different Customer Levels",null,true);
  put(A,"A3","Inputs (from Tab 1)",null,true);
  [[4,"Upfront Grant (G)","'Tab 1'!C15",USD0],[5,"Staff Salary","'Tab 1'!C23",USD0],[6,"Per-subscriber fee (Tier 1)","'Tab 1'!C16",USD0],[7,"Tier 1 threshold","'Tab 1'!C18","0"],[8,"Per-subscriber step-up (Tier 2)","'Tab 1'!C17",USD0],[9,"Bonus 1 (at threshold)","'Tab 1'!C19",USD0],[10,"Bonus 1 threshold","'Tab 1'!C20","0"],[11,"Bonus 2 (at threshold)","'Tab 1'!C21",USD0],[12,"Bonus 2 threshold","'Tab 1'!C22","0"],[13,"Avg Customer Usage (kWh)","'Tab 1'!C3","#,##0"]]
    .forEach(([r,l,fx,fm])=>{ put(A,"A"+r,l); put(A,"C"+r,f(fx),fm); });
  put(A,"A15","Target Thresholds",null,true);
  put(A,"A16","100% Ampion Cost"); put(A,"C16",f("'Tab 1'!C11"),USD3);
  put(A,"A17","70% Ampion Cost"); put(A,"C17",f("'Tab 1'!C10"),USD3);
  put(A,"A19","Cost Analysis by Customer Count",null,true);
  ["# Customers","Total Cost","Cost per kWh","Beats 100% Ampion?","Beats 70% Ampion?"].forEach((h,i)=>{ const c=A.getRow(20).getCell(i+1); c.value=h; c.font={bold:true}; });
  [50,100,150,200,300,400,500,750,1000].forEach((n,j)=>{ const r=21+j;
    put(A,"A"+r,n); put(A,"B"+r,f(`$C$4 + $C$5 + (MIN(A${r}, $C$7) * $C$6) + (MAX(0, A${r} - $C$7) * $C$8) + IF(A${r} >= $C$10, $C$9, 0) + IF(A${r} >= $C$12, $C$11, 0)`),USD0);
    put(A,"C"+r,f(`B${r} / (A${r} * $C$13)`),USD3); put(A,"D"+r,f(`IF(C${r} < $C$16, "YES", "NO")`)); put(A,"E"+r,f(`IF(C${r} < $C$17, "YES", "NO")`)); });
  const gen=["Generic Breakeven Formula (with Tiered Costs)","","Total Cost (N) = G + S + (min(N, T₁) × F₁) + (max(0, N - T₁) × F₂) + B₁(N) + B₂(N)","","TIER 1 (N ≤ T₁): N = (G + S) / (P × U - F₁)","TIER 2 (N > T₁, before bonuses): N = (G + S + T₁ × (F₂ - F₁)) / (P × U - F₂)","TIER 2 + BONUS 1: N = (G + S + T₁ × (F₂ - F₁) + B₁) / (P × U - F₂)","TIER 2 + BOTH BONUSES: N = (G + S + T₁ × (F₂ - F₁) + B₁ + B₂) / (P × U - F₂)","","Note: The breakeven formula becomes piecewise because costs 'jump' at each threshold."];
  gen.forEach((t,i)=>{ if(t) put(A,"A"+(33+i),t,null,i===0); });

  N.columns=[{width:110}];
  ["CC Review Note","Review notes for CC","Our actual breakeven point is where our new cost structure's cost per kWh equals $0.063/kWh","Our desired breakeven point is where our new cost structure's cost per kWh equals $0.028/kWh (30% haircut to Ampion)","Let's calculate both. ","An easy way to think about this is that we should set our new cost/kWh equal to the cost to beat, solving for N, where N is number of customers needed to breakeven with the new costs. G is really the main cost to \"dig out of\" where scale helps us.","Upfront grant (G) + (fixed cost F * number of customers N)]/Total usage e.g. Avg usage * N = 0.063","N = G/(0.063 X usage) - F"]
    .forEach((t,i)=>{ const c=N.getCell("A"+(i+1)); c.value=t; c.alignment={wrapText:true}; if(i===0) c.font={bold:true}; });
  wb.calcProperties={fullCalcOnLoad:true};
  return wb;
}
// Fills the original C&C calculator in place: only the input cells change, then every formula's saved result
// is recalculated and written back, so the file shows correct numbers even before Excel recalculates (Protected View, previews).
async function fillTemplateXlsx(JSZip, bytes, vals, libs){
  const zip=await JSZip.loadAsync(bytes);
  const wbx=await zip.file("xl/workbook.xml").async("string"), rels=await zip.file("xl/_rels/workbook.xml.rels").async("string");
  const pathOf={}; for(const m of wbx.matchAll(/<sheet [^>]*?name="([^"]+)"[^>]*?r:id="([^"]+)"/g)){ const t=(rels.match(new RegExp('<Relationship [^>]*Id="'+m[2]+'"[^>]*Target="([^"]+)"'))||rels.match(new RegExp('<Relationship [^>]*Target="([^"]+)"[^>]*Id="'+m[2]+'"'))||[])[1]; if(t) pathOf[m[1].replace(/&amp;/g,"&")]="xl/"+t.replace(/^\/?xl\//,""); }
  const tabPath=pathOf["Tab 1"]; if(!tabPath) throw new Error("Couldn't find Tab 1 in the template");
  const cellRe=ref=>new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)');
  let tab=await zip.file(tabPath).async("string");
  for(const [ref,num] of Object.entries(vals)){ const m=tab.match(cellRe(ref)); if(!m) throw new Error("Cell "+ref+" missing in template");
    const rep='<c r="'+ref+'"'+m[1].replace(/\s+t="[^"]*"/,"")+'><v>'+String(+num)+'</v></c>'; tab=tab.replace(cellRe(ref),()=>rep); }
  // Fix Tab 1!C41 (Tier 2 breakeven): the template's formula referenced itself and flipped a sign, so it showed 0.
  const BA="'Breakeven Analysis'!", X=`(${BA}$C$4+${BA}$C$5+${BA}$C$7*(${BA}$C$6-${BA}$C$8))`, Dn=`($C$35*${BA}$C$13-${BA}$C$8)`;
  const c41=`IF(${X}/${Dn}<${BA}$C$10,${X}/${Dn},IF((${X}+${BA}$C$9)/${Dn}<${BA}$C$12,(${X}+${BA}$C$9)/${Dn},(${X}+${BA}$C$9+${BA}$C$11)/${Dn}))`;
  const xmlF=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  tab=tab.replace(/(<c r="C41"[^>]*>)<f[^>]*>[\s\S]*?<\/f>/,(m,o)=>o+"<f>"+xmlF(c41)+"</f>");
  tab=tab.replace(/(<c r="C4[23]"[^>]*>)<f ca="1">/g,(m,o)=>o+"<f>");
  zip.file(tabPath,tab);
  // Recalculate every formula and store its result
  const {ExcelJS,HyperFormula}=libs||{};
  if(ExcelJS&&HyperFormula){
    const tmp=await zip.generateAsync({type:"uint8array"}); const wb=new ExcelJS.Workbook(); await wb.xlsx.load(tmp);
    const plain=v=>{ if(v==null) return null; if(typeof v==="object"){ if(v.richText) return v.richText.map(x=>x.text).join(""); if(v.text!=null) return v.text; if("formula" in v||"sharedFormula" in v) return null; if(v.error) return v.error; } return v; };

async function endDrag(){
  if(!drag) return;
  const {row,id,fromCat}=drag; drag=null;
  row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
  const sec=row.closest(".sec"); const toCat=+sec.dataset.cat;
  const ids=[...sec.querySelectorAll(".task")].map(r=>r.dataset.id);
  const items=ids.map(i=>S.tasks.find(x=>x.id===i)).filter(Boolean);
  let slots=items.map(t=>+t.order||0).sort((a,b)=>a-b);
  if(new Set(slots).size<slots.length){ const base=slots[0]||0; slots=items.map((_,i)=>base+i*10); }
  const ops=[];
  items.forEach((t,i)=>{
    const patch={};
    if((+t.order||0)!==slots[i]) patch.order=slots[i];
    if(t.id===id && toCat!==fromCat){
      patch.cat=toCat;
      patch.history=[...(t.history||[]),{at:new Date().toISOString(),text:"Moved to "+CATS[toCat].name,changes:{cat:[CATS[fromCat].name,CATS[toCat].name]}}].slice(-60);
    }
    if(Object.keys(patch).length){ Object.assign(t,patch); ops.push(col().doc(t.id).update(patch)); }
  });
  S.dragging=false; S.pending=false; render();
  if(ops.length){ try{ await Promise.all(ops); toast(toCat!==fromCat?`${CATS[toCat].icon} Moved to ${CATS[toCat].name}`:"↕️ Order saved"); }catch(err){ writeErr(err); } }
}

function notesFor(t){
  // Smartsheet export: a plain summary of next steps only.
  // No Who / Latest / background notes — those can hold internal CP/CC conversation and stay in the app.
  const L=[];
  const ns=String(t.nextStep||"").trim();
  if(ns) ns.split(/\s*;\s*|\s*\n+\s*/).map(s=>s.replace(/^[-•\s]+/,"").trim()).filter(Boolean)
    .forEach(s=>L.push("- "+s.charAt(0).toUpperCase()+s.slice(1)));

async function editDeck(d){
  const prompt=($("edTxt")||{}).value?.trim()||""; S.edTxt=prompt; if(!prompt){ toast("Type what you want changed"); return; }
  S.edBusy=d.id; S.edFor=d.id; S.edErr=false; S.edMsg="Sending your changes to Gamma…"; renderList();
  try{
    const r=await S.mcp.callTool(GAMMA,"edit_gamma",{gammaIdOrUrl:d.url||d.gammaId,prompt},{cache:false});
    const p=r.payload??r; const t=typeof p==="string"?p:JSON.stringify(p||"");
    const id=(p&&typeof p==="object"&&(p.editId||p.edit_id))||(t.match(/"?editId"?\s*[:=]\s*"?([A-Za-z0-9_-]+)/)||[])[1];
    if(!id) throw {code:"tool_error",message:"Gamma didn't return an edit ID. Try again in a minute."};
    S.edMsg="Gamma is editing — bigger changes can take 5+ minutes. You can leave this page open…"; renderList();
    const t0=Date.now(); let done=null;
    while(Date.now()-t0<600000){
      await new Promise(res=>setTimeout(res,5000+Math.random()*2000));
      let st; try{ st=await S.mcp.callTool(GAMMA,"get_edit_status",{editId:id},{cache:false}); }catch(e){ if(e&&e.retryable) continue; throw e; }
      const q=st.payload??st; const f=findStatus(q);
      if(f==="failed"){ const why=(q&&typeof q==="object"&&(q.error||q.reason))||""; throw {code:"tool_error",message:"Gamma couldn't make that edit."+(why?" "+String(why):"")}; }
      if(f==="done"){ done=q; break; }
    }
    if(!done){ S.edMsg="Gamma is still working. Open the deck in a few minutes to see the changes."; return; }
    const sum=(done&&typeof done==="object"&&(done.summary||done.changes))||""; const url=findUrl(done)||d.url;
    S.edMsg=`✅ Done!${sum?" "+esc(String(sum)).slice(0,600):""} ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Open ${esc(d.name)} ↗</a>`:""}`; S.edTxt=""; toast("✏️ Deck updated");
  }catch(e){ S.edErr=true; S.edMsg=esc(mcpMsg(e)); }
  finally{ S.edBusy=null; renderList(); }
}
async function pollGen(gen,deckId){
  const t0=Date.now();
  while(S.slBusy&&Date.now()-t0<240000){
    await new Promise(r=>setTimeout(r,6000+Math.random()*2000));
    if(!S.slBusy) return;
    let r; try{ r=await S.mcp.callTool(GAMMA,"get_generation_status",{generationId:gen},{cache:false}); }catch(e){ if(e&&e.retryable) continue; throw e; }
    const p=r.payload??r; const url=findUrl(p); const st=findStatus(p);
    if(url&&st!=="failed"){ await scol().doc(deckId).update({url,status:"done"}); return url; }
    if(st==="failed") throw {code:"tool_error",message:"Gamma reported the generation failed."};
  }
  return "";
}
async function makeSlides(){
  const tpl=S.slides.find(d=>d.id===$("slTpl").value); const name=$("slName").value.trim();
  S.slTpl=tpl&&tpl.id; S.slName=name; S.slPics=$("slPics").value; S.slNote=$("slNote").value;
  if(!tpl||!name){ toast("Pick a template and type the partner name"); return; }
  const pics=S.slPics.split(/\s+/).filter(x=>/^https?:\/\//.test(x));
  S.slBusy=true; S.slErr=false; S.slMsg="Reading the template from Gamma…"; renderList();
  let deckId=null;
  try{
    const src=await S.mcp.callTool(GAMMA,"read_gamma",{gammaIdOrUrl:tpl.url||tpl.gammaId});
    const raw=typeof src.payload==="string"?src.payload:(src.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const theme=(raw.match(/<theme id="([^"]+)"/)||[])[1];
    const was=tpl.partner||tpl.name.split(/\s+x\s+/i)[0];
    let html=raw.replace(/<HEAD>[\s\S]*?<\/HEAD>/,"");
    html=html.replace(/<section\b/g,"\n---\n<section").replace(/<\/(h[1-6]|p|li|summary|details)>/g,"\n").replace(/<li[^>]*>/g,"- ").replace(/<br\s*\/?>/g,"\n");
    let body=html.replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/[ \t]+/g," ").replace(/\n\s*\n+/g,"\n").replace(/^[\s\S]*?\n---\n/,"").trim();
    const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    [was+" of Central Illinois",was+" of Southern Illinois",was].filter(Boolean).forEach(w=>{ body=body.replace(new RegExp(esc2(w),"g"),name); });
    let pi=0; body=body.replace(/\[(Photo|Image[^\]]*)\]/g,m=>pi<pics.length?pics[pi++]:m);
    body=body.slice(0,60000);
    const inputText=body;
    const extra=`This is a partnership deck from Dimension Energy for ${name}. Keep one card per section separated by ---, in the same order, with the same headings and wording. Do not invent numbers, dates or programs.${S.slNote?" Also apply these changes: "+S.slNote+".":""}${pi<pics.length?" Use these extra images where they fit: "+pics.slice(pi).join(" "):""}`;
    S.slMsg="Gamma is building the deck (about 1–3 minutes)…"; renderList();
    const now=new Date().toISOString();
    const ref=scol().doc(); deckId=ref.id;
    await ref.set({name:`${name} x Dimension`,partner:name,template:false,kind:"pitch",madeFrom:tpl.id,pictures:pics,status:"running",url:"",createdAt:now});
    let res;
    if(/^g_/.test(theme||"")){   // copy the template deck itself in Gamma: same design, layouts and icons
      const prompt=`Make this deck for ${name}. Keep the exact design, layouts, colors, fonts, icons, illustrations, Dimension Energy logos, footer and card order. Replace "${was}" (and any longer form of that name) with "${name}". Do not invent numbers, dates, names or programs.${S.slNote?" Also apply these changes: "+S.slNote+".":""}${pics.length?" Put these images in the [Photo] spots, in order: "+pics.join(" "):""}`;
      res=await S.mcp.callTool(GAMMA,"generate_from_template",{gammaId:theme,prompt,title:`${name} x Dimension`},{cache:false});
    } else {
      const args={inputText,textMode:"preserve",cardSplit:"inputTextBreaks",additionalInstructions:extra,title:`${name} x Dimension`}; if(theme) args.themeId=theme;
      res=await S.mcp.callTool(GAMMA,"generate",args,{cache:false});
    }
    const p=res.payload??res; let url=findUrl(p);
    if(!url){ const gen=findGen(p); if(gen) url=await pollGen(gen,deckId); }
    if(url){ await scol().doc(deckId).update({url,status:"done"}); S.slMsg=`✅ Done! <a href="${esc(url)}" target="_blank" rel="noopener">Open ${esc(name)} x Dimension ↗</a>`; S.slName=""; S.slPics=""; S.slNote=""; toast("📊 Deck ready"); }
    else { await scol().doc(deckId).update({status:"done"}); S.slMsg="Gamma is still working. Check your Gamma home in a few minutes; the deck will be titled \""+esc(name)+" x Dimension\"."; }
  }catch(e){ S.slErr=true; S.slMsg=esc(mcpMsg(e)); if(deckId){ try{ await scol().doc(deckId).update({status:"done"}); }catch{} } }
  finally{ S.slBusy=false; renderList(); }
}

${sec("3. TERM AND TERMINATION.",`<p>3.1 Term: This Agreement will commence on the date first written above and will continue for a term of twelve (12) months, with progress evaluations happening every 3 months. Notwithstanding the foregoing, any of the Parties may terminate this Agreement for any reason without liability to the other Party by providing 60 days’ prior written notice. The Parties’ payment obligations shall survive termination of this Agreement until satisfied in full, and confidentiality obligations in this Agreement will survive for a period of two years after the termination of this Agreement. Within thirty (30) days to the expiration of this Agreement, the Parties may choose by mutual written agreement to exercise an option to renew this Agreement for an additional twelve (12) months.</p><p>3.2 Return, Transfer and Preservation of Information: Following termination, each party shall return, transfer or preserve information as requested by the other party.</p><p>3.3 Early Termination. Notwithstanding anything to the contrary, the Company will have the right to terminate this Agreement in the event of a breach of Section 6 of this Agreement (Exclusivity) or the Statement of Work.</p>`)}
${sec("4. COSTS AND EXPENSES.",`<p>Unless specifically provided in a SOW, each Party will bear its own costs and expenses in performing its role under the Agreement. The CAP will not provide any financing or investment in relation to the Project and will not have any ownership interest in it.</p>`)}
${sec("5. CONFIDENTIALITY.",`<p>5.1 During the term of this Agreement, either Party (as the “Disclosing Party”) may disclose or make available to the other Party (as the “Receiving Party”) information about its business affairs, products/services, confidential intellectual property, trade secrets, third-party confidential information and other sensitive or proprietary information, whether orally or in written, electronic or other form or media, and whether or not marked, designated or otherwise identified as “confidential” (collectively, “Confidential Information”).</p><p>5.2 Confidential Information shall not include information that at the time of disclosure: a. is or becomes generally available to and known by the public other than as a result of, directly or indirectly, any breach of this section by the Receiving Party or any of its representatives; b. is or becomes available to the Receiving Party on a non-confidential basis from a third-party source, provided that such third party is not and was not prohibited from disclosing such Confidential Information; c. was known by, or in the possession of, the Receiving Party or its representatives before being disclosed by or on behalf of the Disclosing Party; d. was or is independently developed by the Receiving Party without reference to or use, in whole or in part, of any of the Disclosing Party's Confidential Information; or e. is required to be disclosed under applicable federal, state or local law, regulation or a valid order issued by a court or governmental agency of competent jurisdiction.</p><p>5.3 The Receiving Party shall: a. protect and safeguard the confidentiality of the Disclosing Party's Confidential Information with at least the same degree of care as the Receiving Party would protect its own Confidential Information, but in no event with less than a commercially reasonable degree of care; b. not use the Disclosing Party's Confidential Information, or permit it to be accessed or used, for any purpose other than to exercise its rights or perform its obligations under this Agreement; c. and not disclose any such Confidential Information to any person or entity, except to the Receiving Party's representatives who need to know the Confidential Information to assist the Receiving Party, or act on its behalf, to exercise its rights or perform its obligations under this Agreement.</p><p>5.4 The Receiving Party shall be responsible for any breach of this section caused by any of its representatives.</p>`)}
${sec("6. EXCLUSIVITY.",`<p>The CAP will perform the Services exclusively for the Company. Any breach of this provision such as enrolling the customers for any other community solar projects not owned by the Company or one of its affiliates shall be a breach entitling the Company to immediately terminate this Agreement and/or any SOW.</p>`)}
${sec("7. REPRESENTATIONS AND WARRANTIES.",`<p>7.1 Representations and Warranties of Company. Company represents and warrants as follows: a. Organization. Company is duly organized and validly existing under the laws of the state in which it is incorporated or organized. b. Authorization. This Agreement has been duly authorized, executed and delivered by Company.</p><p>7.2 Representation and Warranties of CAP. CAP represents and warrants as follows: a. Organization. CAP is a corporation duly organized and validly existing under the laws of the state in which it is incorporated or organized. b. Authorization. This Agreement has been duly authorized, executed and delivered by CAP.</p>`)}
${sec("8. INDEMNIFICATION AND LIMITATION OF LIABILITY.",`<p>Each Party shall indemnify, defend, and hold harmless the other Party from all claims arising hereunder, including third-party claims, resulting from such Party’s breach of this Agreement or violations of Applicable Law.</p><p>The liability of a Party under this Agreement shall be limited to the amount of Services Fees paid to CAP by the Company in the twelve (12) month period preceding the claim, except in the case of gross negligence, willful misconduct, or violations of Applicable Law. NEITHER PARTY SHALL BE LIABLE TO THE OTHER PARTY FOR ANY INDIRECT, INCIDENTAL, SPECIAL, CONSEQUENTIAL, OR PUNITIVE DAMAGES. This Section 8 shall survive the termination of this Agreement.</p>`)}
${sec("9. MISCELLANEOUS.",`<p>9.1 Relationship of the Parties. Neither Party nor its Representatives will have the authority to bind the other Party other than as specifically authorized by this Agreement or in an SOW. The parties acknowledge and agree that the relationship arising from this Agreement and any SOWs does not constitute or create a general agency, joint venture, partnership, employee relationship, license, or franchise between them and that CAP is an independent contractor with respect to the Services provided under this Agreement.</p><p>9.2 Amendments; Waivers. Except as otherwise provided in this Agreement, no modification, amendment or waiver of any provision of this Agreement or any SOW will be effective unless in writing and signed by the party against whom the modification, amendment or waiver is to be asserted.</p><p>9.3 Notices. Any notices to be given to a party will be deemed to have been given if delivered personally in writing, if sent express, overnight, or registered mail to a party at the respective addresses, or if sent by email, provided confirmation of receipt of such email is received by sender. Any notice will be deemed to have been given on the day it was received.</p><p>a. Notices to Company will be sent to: General Counsel, 3050 Peachtree Rd., NE, Suite 350, Atlanta, GA 30305, (866) 526-0083, legal@dimension-energy.com</p><p>b. Notices to CAP will be sent to: ${X(m.cap)}, ${X(m.addr)}, Telephone No: ${X(m.phone)}, Attention: ${X(m.attn)}</p><p>9.4 Assignment. Neither this Agreement nor any SOW may be assigned or otherwise transferred by the CAP without the prior written and sole consent of the Company. The CAP will not delegate any of its role or responsibilities under this Agreement without the prior written and sole consent of the Company. Consent as required in both cases will not be unreasonably withheld, delayed, conditioned, or denied. Company shall have the right to assign this Agreement to affiliates and other transferees at its sole discretion.</p><p>9.5 Severability. If any term or provision of this Agreement or any SOW is held invalid, illegal or unenforceable by a court of competent jurisdiction by reason of any Applicable Law or public policy, all other conditions and provisions of this Agreement, or any SOW, will remain in full force and effect.</p><p>9.6 No Presumption Against Drafting Party. The parties have participated jointly in the negotiation and drafting of this Agreement and any SOW governed by this Agreement. In the event of an ambiguity or question of intent or interpretation arises with respect to this Agreement or any SOW, this Agreement or such SOW shall be construed as if drafted jointly by the parties. No presumption or burden of proof shall arise favoring or disfavoring any party by virtue of the authorship of any of the provisions of this Agreement or any SOW.</p><p>9.7 Governing Law. This Agreement will be governed by the laws of the state of Virginia, regardless of the choice of law principles thereof. Each of the Parties hereby irrevocably consents and agrees that any legal action or proceedings brought with respect to a dispute arising out of this Agreement shall be brought in, and each Party submits to the jurisdiction and venue of the State and federal courts located in the state of Illinois, and by execution and delivery of this Agreement, each of the Parties hereby (i) accepts the non-exclusive jurisdiction of the foregoing courts, (ii) irrevocably agrees to be bound by any final judgment (subject to any appeal) of any such court with respect thereto, and (iii) irrevocably waives, to the fullest extent permitted by law, any objection which it may now or hereafter have to the laying of venues of any suit, action or proceedings with respect hereto brought in any such court, and further irrevocably waives to the fullest extent permitted by law any claim that any such suit, action or proceedings brought in any such court has been brought in an inconvenient forum. TO THE EXTENT PERMITTED UNDER APPLICABLE LAW, EACH OF THE PARTIES IRREVOCABLY WAIVES ALL RIGHT TO TRIAL BY JURY IN ANY ACTION, PROCEEDING OR COUNTERCLAIM (WHETHER BASED ON CONTRACT, TORT OR OTHERWISE) ARISING OUT OF OR RELATING TO THIS AGREEMENT, THE SERVICES PROVIDED PURSUANT TO THIS AGREEMENT OR THE ACTIONS OF THE PARTIES IN THE NEGOTIATION, ADMINISTRATION, PERFORMANCE OR ENFORCEMENT HEREOF.</p><p>9.8 Headings. The headings in this Agreement and any SOW are for reference only and shall not be used to affect the interpretation of this Agreement or such SOW.</p><p>9.9 Entire Agreement. This Agreement, together with, the SOW and supplements, constitutes the entire agreement between the parties with respect to the subject matter, and all prior agreements and representation of the parties, whether written or oral, are merged herein and will be of no further force or effect.</p><p>9.10 Counterparts; Electronic Delivery. This Agreement and any SOW may be signed in any number of counterparts, each of which shall be an original, with the same effect as if the signatures were upon the same instrument. Delivery of a signed counterpart of a signature page of this Agreement or any SOW by facsimile or by PDF file (portable document format file) shall be as effective as delivery of a manually signed counterpart of this Agreement.</p><p style="text-align:center">[Signature Page Follows]</p>`)}
